<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Two phones side by side: iOS share sheet + Android widget -->
  <!-- Phone 1 (iOS share) -->
  <g>
    <rect x="36" y="14" width="100" height="152" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <rect x="44" y="26" width="84" height="92" rx="3" fill="#0a0a0c" />
    <text x="86" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#71717a">Share to</text>
    <rect x="50" y="50" width="74" height="14" rx="3" fill="#27272a" />
    <text x="56" y="60" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#a1a1aa">Messages</text>
    <rect x="50" y="68" width="74" height="14" rx="3" fill="#fafafa" stroke="#FF6B1A" stroke-width="1" />
    <circle cx="56" cy="75" r="2" fill="#FF6B1A" />
    <text x="62" y="78" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#0a0a0c">memory.wiki</text>
    <rect x="50" y="86" width="74" height="14" rx="3" fill="#27272a" />
    <text x="56" y="96" font-family="system-ui, sans-serif" font-size="7" font-weight="600" fill="#a1a1aa">Mail</text>
    <text x="86" y="138" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" font-weight="700" letter-spacing="0.05em" fill="#a1a1aa">iOS</text>
    <text x="86" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#71717a">Share Sheet</text>
  </g>
  <!-- Phone 2 (Android widget) -->
  <g>
    <rect x="184" y="14" width="100" height="152" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
    <rect x="192" y="26" width="84" height="92" rx="3" fill="#0a0a0c" />
    <!-- Widget on home screen -->
    <rect x="198" y="34" width="72" height="48" rx="6" fill="#FF6B1A" fill-opacity="0.15" stroke="#FF6B1A" stroke-width="1" />
    <text x="206" y="48" font-family="system-ui, sans-serif" font-size="7" font-weight="700" fill="#FF6B1A">memory.wiki</text>
    <rect x="206" y="54" width="58" height="3" rx="1.5" fill="#fafafa" />
    <rect x="206" y="62" width="50" height="3" rx="1.5" fill="#a1a1aa" />
    <rect x="206" y="70" width="56" height="3" rx="1.5" fill="#a1a1aa" />
    <!-- App icons row -->
    <circle cx="208" cy="100" r="6" fill="#27272a" />
    <circle cx="226" cy="100" r="6" fill="#27272a" />
    <circle cx="244" cy="100" r="6" fill="#27272a" />
    <circle cx="262" cy="100" r="6" fill="#27272a" />
    <text x="234" y="138" text-anchor="middle" font-family="ui-monospace, monospace" font-size="7" font-weight="700" letter-spacing="0.05em" fill="#a1a1aa">ANDROID</text>
    <text x="234" y="152" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#71717a">Home widget</text>
  </g>
</svg>
