<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- MCP server bridging AI tools and your hub -->
  <!-- Left: AI clients -->
  <g>
    <rect x="14" y="40" width="84" height="28" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="56" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fafafa">Claude</text>
    <rect x="14" y="78" width="84" height="28" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="56" y="96" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fafafa">Cursor</text>
    <rect x="14" y="116" width="84" height="28" rx="14" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="56" y="134" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fafafa">Codex</text>
  </g>
  <!-- Connection lines to MCP -->
  <g stroke="#52525b" stroke-width="1" fill="none" stroke-dasharray="3 3">
    <path d="M98 54 L138 90" />
    <path d="M98 92 L138 92" />
    <path d="M98 130 L138 94" />
  </g>
  <!-- MCP server (center) -->
  <g>
    <rect x="138" y="72" width="60" height="40" rx="6" fill="#fb923c" />
    <text x="168" y="91" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#0a0a0c">MCP</text>
    <text x="168" y="103" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#0a0a0c">server</text>
  </g>
  <!-- Line to hub -->
  <g stroke="#fb923c" stroke-width="1.5" fill="none">
    <path d="M198 92 L240 92" stroke-linecap="round" />
    <polyline points="232,86 240,92 232,98" stroke-linejoin="round" />
  </g>
  <!-- Right: hub -->
  <g>
    <rect x="240" y="72" width="68" height="40" rx="8" fill="#0a0a0c" stroke="#27272a" stroke-width="1" />
    <text x="274" y="88" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#fafafa">memory</text>
    <text x="274" y="100" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" font-weight="600" fill="#fafafa">.wiki</text>
  </g>
  <!-- Tool list bottom -->
  <text x="160" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.05em" fill="#71717a">read · search · create · update · publish</text>
</svg>
