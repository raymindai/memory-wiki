<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <!-- Capture hero. Brand-correct: monochrome zinc base, micro-color
       (orange-dark #FF6B1A) used ONLY as the capture indicator dot
       and a small lime tick at the saved end. No gradients / glows /
       accent rails per brand cheat-sheet. -->

  <!-- Source: a web article card, top-left, slightly rotated -->
  <g transform="translate(60, 60) rotate(-5)">
    <rect width="160" height="120" rx="10" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <!-- mini bookmark dot (orange micro = capture source) -->
    <circle cx="146" cy="14" r="4" fill="#FF6B1A" />
    <rect x="16" y="16" width="80" height="6" rx="3" fill="#fafafa" />
    <rect x="16" y="32" width="128" height="3" rx="1.5" fill="#71717a" />
    <rect x="16" y="40" width="112" height="3" rx="1.5" fill="#71717a" />
    <rect x="16" y="48" width="120" height="3" rx="1.5" fill="#71717a" />
    <rect x="16" y="64" width="80" height="4" rx="2" fill="#a1a1aa" />
    <rect x="16" y="78" width="128" height="3" rx="1.5" fill="#71717a" />
    <rect x="16" y="86" width="100" height="3" rx="1.5" fill="#71717a" />
    <rect x="16" y="94" width="116" height="3" rx="1.5" fill="#71717a" />
  </g>

  <!-- Source: a chat exchange, bottom-left -->
  <g transform="translate(40, 200) rotate(3)">
    <rect width="180" height="92" rx="14" fill="#18181b" stroke="#3f3f46" stroke-width="1" />
    <!-- avatar circle (neutral) -->
    <circle cx="24" cy="24" r="9" fill="#52525b" />
    <rect x="42" y="18" width="120" height="4" rx="2" fill="#d4d4d8" />
    <rect x="42" y="28" width="96" height="3" rx="1.5" fill="#71717a" />
    <rect x="16" y="52" width="148" height="3" rx="1.5" fill="#52525b" />
    <rect x="16" y="60" width="132" height="3" rx="1.5" fill="#52525b" />
    <rect x="16" y="68" width="140" height="3" rx="1.5" fill="#52525b" />
    <rect x="16" y="76" width="100" height="3" rx="1.5" fill="#52525b" />
  </g>

  <!-- Source: PDF file, top-middle slightly behind -->
  <g transform="translate(220, 110) rotate(7)">
    <path d="M0 0 L72 0 L96 24 L96 124 L0 124 Z" fill="#3f3f46" stroke="#52525b" stroke-width="1" />
    <path d="M72 0 L96 24 L72 24 Z" fill="#52525b" />
    <rect x="14" y="84" width="68" height="3" rx="1.5" fill="#71717a" />
    <rect x="14" y="92" width="60" height="3" rx="1.5" fill="#71717a" />
    <rect x="14" y="100" width="64" height="3" rx="1.5" fill="#71717a" />
    <text x="48" y="62" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="700" fill="#fafafa">PDF</text>
  </g>

  <!-- Flow lines — dashed zinc, no accent gradient -->
  <g stroke="#52525b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5" fill="none">
    <path d="M230 95 Q330 130 410 175" />
    <path d="M220 240 Q330 215 410 188" />
    <path d="M328 145 Q380 165 410 180" />
  </g>

  <!-- URL chip target, right side -->
  <g>
    <rect x="408" y="146" width="200" height="68" rx="34" fill="#fafafa" stroke="#27272a" stroke-width="1" />
    <!-- + glyph in capture-orange micro -->
    <circle cx="442" cy="180" r="14" fill="#FF6B1A" />
    <text x="442" y="186" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#fafafa">+</text>
    <text x="535" y="186" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" fill="#18181b">memory.wiki/abc</text>
  </g>

  <!-- Small lime tick = "saved" -->
  <circle cx="608" cy="146" r="6" fill="#B5FF1A" />
  <path d="M605 146 L607 148 L611 144" stroke="#18181b" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
</svg>
