<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- VS Code window: activity bar + sidebar + editor + memory.wiki sidebar panel -->
  <rect x="14" y="14" width="292" height="152" rx="6" fill="#1e1e1e" stroke="#3f3f46" stroke-width="1" />
  <!-- Activity bar (left thin strip) -->
  <rect x="14" y="14" width="22" height="152" fill="#333333" />
  <circle cx="25" cy="32" r="4" fill="#71717a" />
  <circle cx="25" cy="50" r="4" fill="#71717a" />
  <circle cx="25" cy="68" r="4" fill="#71717a" />
  <circle cx="25" cy="86" r="4" fill="#fb923c" />
  <!-- memory.wiki sidebar -->
  <rect x="36" y="14" width="100" height="152" fill="#252526" />
  <text x="50" y="32" font-family="ui-monospace, monospace" font-size="8" font-weight="700" letter-spacing="0.05em" fill="#cccccc">MEMORY.WIKI</text>
  <text x="50" y="50" font-family="ui-monospace, monospace" font-size="7" font-weight="600" fill="#71717a">CLOUD</text>
  <rect x="50" y="56" width="78" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="50" y="64" width="64" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="50" y="72" width="70" height="3" rx="1.5" fill="#3f3f46" />
  <text x="50" y="90" font-family="ui-monospace, monospace" font-size="7" font-weight="600" fill="#71717a">LOCAL</text>
  <rect x="50" y="96" width="74" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="50" y="104" width="68" height="3" rx="1.5" fill="#3f3f46" />
  <!-- Editor area -->
  <rect x="136" y="14" width="170" height="22" fill="#2d2d2d" />
  <rect x="146" y="22" width="60" height="6" rx="2" fill="#3f3f46" />
  <!-- Editor content -->
  <text x="146" y="58" font-family="ui-monospace, monospace" font-size="11" font-weight="600" fill="#fafafa"># notes.md</text>
  <rect x="146" y="74" width="120" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="146" y="82" width="100" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="146" y="98" width="60" height="4" rx="1.5" fill="#fb923c" />
  <rect x="146" y="110" width="140" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="146" y="118" width="120" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="146" y="126" width="130" height="3" rx="1.5" fill="#3f3f46" />
</svg>
