<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <!-- Organize hero. Monochrome composition: docs → bundle hubs →
       single hub URL. Micro-color only at semantic nodes: lime dot =
       active/shipped, info-blue dot = sync. No gradients. -->

  <!-- Left: doc grid (12 small doc tiles) -->
  <g transform="translate(40, 60)">
    <g fill="#27272a" stroke="#3f3f46" stroke-width="1">
      <rect x="0"  y="0"   width="40" height="30" rx="3" />
      <rect x="48" y="0"   width="40" height="30" rx="3" />
      <rect x="96" y="0"   width="40" height="30" rx="3" />
      <rect x="0"  y="38"  width="40" height="30" rx="3" />
      <rect x="48" y="38"  width="40" height="30" rx="3" />
      <rect x="96" y="38"  width="40" height="30" rx="3" />
      <rect x="0"  y="76"  width="40" height="30" rx="3" />
      <rect x="48" y="76"  width="40" height="30" rx="3" />
      <rect x="96" y="76"  width="40" height="30" rx="3" />
      <rect x="0"  y="114" width="40" height="30" rx="3" />
      <rect x="48" y="114" width="40" height="30" rx="3" />
      <rect x="96" y="114" width="40" height="30" rx="3" />
    </g>
    <!-- Tiny lines suggesting content -->
    <g fill="#52525b">
      <rect x="6"  y="8"   width="24" height="2" rx="1" />
      <rect x="6"  y="14"  width="18" height="2" rx="1" />
      <rect x="6"  y="20"  width="22" height="2" rx="1" />
      <rect x="54" y="8"   width="22" height="2" rx="1" />
      <rect x="54" y="14"  width="26" height="2" rx="1" />
      <rect x="54" y="20"  width="18" height="2" rx="1" />
      <rect x="102" y="8"  width="26" height="2" rx="1" />
      <rect x="102" y="14" width="20" height="2" rx="1" />
      <rect x="102" y="20" width="22" height="2" rx="1" />
    </g>
    <!-- one lime accent dot = the doc you just made -->
    <circle cx="128" cy="124" r="3" fill="#B5FF1A" />
    <text x="68" y="170" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#71717a">DOCS</text>
  </g>

  <!-- Connection lines docs → bundles -->
  <g stroke="#3f3f46" stroke-width="1" fill="none">
    <path d="M180 90 L260 100" />
    <path d="M180 130 L260 140" />
    <path d="M180 170 L260 180" />
  </g>

  <!-- Middle: bundle stack (3 cards) -->
  <g transform="translate(260, 70)">
    <g>
      <rect width="120" height="40" rx="8" fill="#3f3f46" stroke="#52525b" stroke-width="1" />
      <rect x="14" y="14" width="64" height="4" rx="2" fill="#fafafa" />
      <rect x="14" y="24" width="48" height="3" rx="1.5" fill="#a1a1aa" />
      <rect x="98" y="14" width="8" height="3" rx="1.5" fill="#52525b" />
      <rect x="98" y="20" width="8" height="3" rx="1.5" fill="#52525b" />
      <rect x="98" y="26" width="8" height="3" rx="1.5" fill="#52525b" />
    </g>
    <g transform="translate(0, 50)">
      <rect width="120" height="40" rx="8" fill="#3f3f46" stroke="#52525b" stroke-width="1" />
      <rect x="14" y="14" width="56" height="4" rx="2" fill="#fafafa" />
      <rect x="14" y="24" width="40" height="3" rx="1.5" fill="#a1a1aa" />
      <rect x="98" y="14" width="8" height="3" rx="1.5" fill="#52525b" />
      <rect x="98" y="20" width="8" height="3" rx="1.5" fill="#52525b" />
      <rect x="98" y="26" width="8" height="3" rx="1.5" fill="#52525b" />
    </g>
    <g transform="translate(0, 100)">
      <rect width="120" height="40" rx="8" fill="#3f3f46" stroke="#52525b" stroke-width="1" />
      <rect x="14" y="14" width="72" height="4" rx="2" fill="#fafafa" />
      <rect x="14" y="24" width="52" height="3" rx="1.5" fill="#a1a1aa" />
      <rect x="98" y="14" width="8" height="3" rx="1.5" fill="#52525b" />
      <rect x="98" y="20" width="8" height="3" rx="1.5" fill="#52525b" />
      <rect x="98" y="26" width="8" height="3" rx="1.5" fill="#52525b" />
    </g>
    <text x="60" y="160" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#71717a">BUNDLES</text>
  </g>

  <!-- Connection lines bundles → hub -->
  <g stroke="#3f3f46" stroke-width="1" fill="none">
    <path d="M380 90  L460 150" />
    <path d="M380 140 L460 160" />
    <path d="M380 190 L460 170" />
  </g>

  <!-- Right: HUB URL chip -->
  <g>
    <rect x="460" y="138" width="160" height="48" rx="24" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <text x="540" y="170" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" fill="#fafafa">memory.wiki/@you</text>
    <!-- info-blue dot = sync indicator -->
    <circle cx="478" cy="162" r="4" fill="#60A5FA" />
  </g>
  <text x="540" y="216" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="0.1em" fill="#71717a">HUB</text>
</svg>
