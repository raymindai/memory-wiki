<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <!-- Use hero. Monochrome composition: hub URL fans out to 5 AI
       client pills. Micro-color used only where semantic: info-blue
       dot on the URL (sync), one ai-purple dot signaling AI delivery. -->

  <!-- HUB URL chip, top center -->
  <g>
    <rect x="220" y="40" width="200" height="56" rx="28" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <!-- info-blue dot = sync state -->
    <circle cx="242" cy="68" r="5" fill="#60A5FA" />
    <text x="324" y="76" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#fafafa">memory.wiki/@you</text>
  </g>

  <!-- Fan-out connections (zinc, no accent gradients) -->
  <g stroke="#3f3f46" stroke-width="1.25" fill="none">
    <path d="M320 96 Q260 150 100 200" stroke-linecap="round" />
    <path d="M320 96 Q280 140 220 200" stroke-linecap="round" />
    <path d="M320 96 L320 200" stroke-linecap="round" />
    <path d="M320 96 Q360 140 420 200" stroke-linecap="round" />
    <path d="M320 96 Q380 150 540 200" stroke-linecap="round" />
  </g>

  <!-- Five AI pills, evenly spaced -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#fafafa">
    <!-- Claude -->
    <g>
      <rect x="40"  y="200" width="120" height="44" rx="22" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="100" y="227" text-anchor="middle">Claude</text>
    </g>
    <!-- ChatGPT -->
    <g>
      <rect x="170" y="200" width="120" height="44" rx="22" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="230" y="227" text-anchor="middle">ChatGPT</text>
    </g>
    <!-- Cursor -->
    <g>
      <rect x="260" y="200" width="120" height="44" rx="22" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="320" y="227" text-anchor="middle">Cursor</text>
    </g>
    <!-- Codex -->
    <g>
      <rect x="360" y="200" width="120" height="44" rx="22" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="420" y="227" text-anchor="middle">Codex</text>
    </g>
    <!-- Gemini -->
    <g>
      <rect x="480" y="200" width="120" height="44" rx="22" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
      <text x="540" y="227" text-anchor="middle">Gemini</text>
    </g>
  </g>

  <!-- Caption -->
  <text x="320" y="280" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#71717a">SAME URL · EVERY AI</text>
</svg>
