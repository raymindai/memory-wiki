<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" fill="none">
  <!-- Cross-AI fan-out: URL chip top, 5 AI labels bottom -->
  <!-- URL chip -->
  <g>
    <rect x="178" y="20" width="124" height="40" rx="20" fill="#0a0a0c" stroke="#fb923c" stroke-width="1.5" />
    <text x="240" y="46" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600" fill="#fafafa">memory.wiki/@you</text>
  </g>
  <!-- Fan-out lines -->
  <g stroke="#52525b" stroke-width="1" fill="none">
    <path d="M240 60 Q200 90 60 140" stroke-linecap="round" />
    <path d="M240 60 Q210 90 150 140" stroke-linecap="round" />
    <path d="M240 60 L240 140" stroke-linecap="round" />
    <path d="M240 60 Q270 90 330 140" stroke-linecap="round" />
    <path d="M240 60 Q280 90 420 140" stroke-linecap="round" />
  </g>
  <!-- AI labels -->
  <g font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fafafa">
    <rect x="20" y="140" width="80" height="30" rx="15" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="60" y="159" text-anchor="middle">Claude</text>
    <rect x="110" y="140" width="80" height="30" rx="15" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="150" y="159" text-anchor="middle">ChatGPT</text>
    <rect x="200" y="140" width="80" height="30" rx="15" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="240" y="159" text-anchor="middle">Cursor</text>
    <rect x="290" y="140" width="80" height="30" rx="15" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="330" y="159" text-anchor="middle">Codex</text>
    <rect x="380" y="140" width="80" height="30" rx="15" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
    <text x="420" y="159" text-anchor="middle">Gemini</text>
  </g>
  <text x="240" y="190" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" letter-spacing="0.05em" fill="#71717a">SAME URL · EVERY AI</text>
</svg>
