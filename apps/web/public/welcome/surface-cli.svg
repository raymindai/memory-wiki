<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Terminal window with `mw` command -->
  <rect x="14" y="14" width="292" height="152" rx="8" fill="#0a0a0c" stroke="#27272a" stroke-width="1" />
  <!-- Title bar -->
  <rect x="14" y="14" width="292" height="22" rx="8" fill="#1c1c24" />
  <circle cx="26" cy="25" r="3" fill="#ff6058" />
  <circle cx="36" cy="25" r="3" fill="#ffbe2f" />
  <circle cx="46" cy="25" r="3" fill="#28c83f" />
  <text x="160" y="29" text-anchor="middle" font-family="ui-monospace, monospace" font-size="9" fill="#71717a">~/notes</text>
  <!-- Prompt lines -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
    <text x="28" y="60" fill="#4ade80">$</text>
    <text x="44" y="60" fill="#fafafa">cat meeting.md | mw capture</text>
    <text x="28" y="78" fill="#a1a1aa">→ memory.wiki/x9k2j</text>
    <text x="28" y="106" fill="#4ade80">$</text>
    <text x="44" y="106" fill="#fafafa">mw read x9k2j</text>
    <text x="28" y="124" fill="#a1a1aa"># Meeting notes</text>
    <text x="28" y="138" fill="#a1a1aa">## Decisions</text>
    <text x="28" y="152" fill="#a1a1aa">- ship Q4 ▌</text>
  </g>
</svg>
