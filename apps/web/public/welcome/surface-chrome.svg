<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Browser window outline + Add button + URL chip -->
  <rect x="14" y="14" width="292" height="152" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <!-- Tab strip -->
  <rect x="14" y="14" width="292" height="22" rx="8" fill="#27272a" />
  <circle cx="26" cy="25" r="3" fill="#52525b" />
  <circle cx="36" cy="25" r="3" fill="#52525b" />
  <circle cx="46" cy="25" r="3" fill="#52525b" />
  <!-- Address bar -->
  <rect x="14" y="36" width="292" height="22" fill="#0a0a0c" />
  <rect x="26" y="42" width="220" height="10" rx="5" fill="#27272a" />
  <!-- Page content -->
  <rect x="32" y="74" width="160" height="6" rx="3" fill="#52525b" />
  <rect x="32" y="86" width="200" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="32" y="94" width="180" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="32" y="102" width="190" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="32" y="118" width="140" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="32" y="126" width="160" height="3" rx="1.5" fill="#3f3f46" />
  <!-- memory.wiki Add button (floating in top-right of page) -->
  <g>
    <rect x="234" y="68" width="62" height="22" rx="11" fill="#fafafa" />
    <circle cx="246" cy="79" r="6" fill="#fb923c" />
    <text x="246" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0a0a0c">+</text>
    <text x="276" y="83" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="600" fill="#0a0a0c">Add</text>
  </g>
</svg>
