<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none">
  <!-- Mac window outline + sidebar + content + QuickLook .md badge -->
  <rect x="14" y="14" width="292" height="152" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <!-- Title bar with traffic lights -->
  <rect x="14" y="14" width="292" height="22" rx="8" fill="#27272a" />
  <circle cx="26" cy="25" r="3" fill="#ff6058" />
  <circle cx="36" cy="25" r="3" fill="#ffbe2f" />
  <circle cx="46" cy="25" r="3" fill="#28c83f" />
  <text x="160" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#a1a1aa">memory.wiki</text>
  <!-- Sidebar -->
  <rect x="14" y="36" width="100" height="130" fill="#0a0a0c" />
  <text x="28" y="55" font-family="ui-monospace, monospace" font-size="9" font-weight="700" letter-spacing="0.05em" fill="#71717a">LIBRARY</text>
  <rect x="28" y="64" width="76" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="28" y="76" width="64" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="28" y="88" width="80" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="28" y="100" width="72" height="3" rx="1.5" fill="#3f3f46" />
  <rect x="28" y="112" width="68" height="3" rx="1.5" fill="#3f3f46" />
  <!-- Content -->
  <rect x="124" y="48" width="140" height="6" rx="3" fill="#fafafa" />
  <rect x="124" y="62" width="160" height="3" rx="1.5" fill="#52525b" />
  <rect x="124" y="70" width="148" height="3" rx="1.5" fill="#52525b" />
  <rect x="124" y="78" width="156" height="3" rx="1.5" fill="#52525b" />
  <!-- QuickLook .md badge — neutral fill, orange used only as small dot -->
  <g>
    <rect x="220" y="120" width="68" height="32" rx="6" fill="#fafafa" stroke="#FF6B1A" stroke-width="1" />
    <circle cx="230" cy="130" r="3" fill="#FF6B1A" />
    <text x="262" y="134" text-anchor="middle" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#18181b">.md</text>
    <text x="254" y="146" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#18181b">QuickLook</text>
  </g>
</svg>
