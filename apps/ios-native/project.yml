# XcodeGen spec — single source of truth for the iOS project.
# Edit this file then run `xcodegen generate` to refresh the
# .xcodeproj. Never hand-edit project.pbxproj.

name: MemoryWiki
options:
  bundleIdPrefix: wiki.memory
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top

# Locales bundled with the app. iOS picks based on the user's
# language settings; English is the dev/source language so the
# literal `Text("Save")` works as the key in Localizable.strings.

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set DEVELOPMENT_TEAM in your local environment via
    # `xcodebuild -allowProvisioningUpdates` flow or via Xcode
    # Signing & Capabilities — kept out of the spec so the repo
    # has no per-developer state.

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  MemoryWiki:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
      - target: ShareExtension
        embed: true
        codeSign: true
      - target: MemoryWikiWidget
        embed: true
        codeSign: true
    sources:
      - path: MemoryWiki
        excludes:
          - "**/.DS_Store"
      - path: Shared
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MemoryWiki/Assets.xcassets
      - path: MemoryWiki/Preview Content
      - path: MemoryWiki/Fonts
      - path: MemoryWiki/Resources
        excludes:
          - "**/*.lproj/**"
      # Localised string bundles — listed explicitly so xcodegen
      # creates variant groups in the project (which is how iOS
      # picks the right one based on user locale).
      - path: MemoryWiki/Resources/en.lproj/Localizable.strings
      - path: MemoryWiki/Resources/ko.lproj/Localizable.strings
    info:
      path: MemoryWiki/Info.plist
      properties:
        CFBundleDisplayName: Memory.Wiki
        # Siri pronounces CFBundleSpokenName instead of trying to
        # vocalise CFBundleDisplayName. Without this Siri reads
        # "Memory.Wiki" as "memory dot wiki" and requires the user
        # to literally say "dot" — broken UX. Spoken name drops
        # the dot so "Memory Wiki" matches both pronunciation and
        # recognition.
        CFBundleSpokenName: Memory Wiki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          # Use a dedicated LaunchBackground color (dark zinc) so
          # AccentColor stays free to be the brand ink tint without
          # leaking lime into the launch flash.
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # memorywiki:// — custom scheme for OAuth callback + share
        # extension hand-off. Universal Links (https://memory.wiki/*)
        # come later via apple-app-site-association on the web app.
        CFBundleURLTypes:
          - CFBundleURLName: wiki.memory.MemoryWiki
            CFBundleURLSchemes: [memorywiki]
        # The web sign-in screen runs in SFSafariViewController;
        # no specific transport-security exception required since
        # everything is https.
        NSCameraUsageDescription: "Memory.Wiki captures photos and screenshots as documents you can paste into any AI."
        NSPhotoLibraryAddUsageDescription: "Save Memory.Wiki documents back to Photos when exporting."
        NSMicrophoneUsageDescription: "Voice dictation in the Capture editor — speak your note instead of typing."
        NSSpeechRecognitionUsageDescription: "Voice dictation runs on-device whenever possible to convert speech into a markdown note."
        # Bundled brand fonts — Cal Sans (display, OFL), JetBrains
        # Mono (mono, OFL), Noto Sans (body, OFL). Same family the
        # web app loads via next/font + cdn so iOS chrome reads as a
        # continuation of memory.wiki, not a stock SwiftUI shell.
        UIAppFonts:
          - CalSans-Regular.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - NotoSans-Regular.ttf
          - NotoSans-Medium.ttf
          - NotoSans-SemiBold.ttf
        # Force the brand's dark zinc treatment at launch — web app
        # default is dark too. Users can override via system Light
        # Mode but the default matches the web canvas.
        UIUserInterfaceStyle: Dark
        # Background fetch identifier registered in
        # BackgroundRefresh.registerHandler(). iOS rejects
        # scheduleAppRefresh calls for identifiers not listed here.
        BGTaskSchedulerPermittedIdentifiers:
          - wiki.memory.MemoryWiki.recent-refresh
        UIBackgroundModes:
          - fetch
        # Supabase config — substituted from Config/Secrets.xcconfig
        # at build time. The xcconfig is gitignored; the .example
        # template is checked in.
        MWSupabaseURL: $(MEMORY_WIKI_SUPABASE_URL)
        MWSupabaseAnonKey: $(MEMORY_WIKI_SUPABASE_ANON_KEY)
        # Home-screen Quick Actions — long-press the app icon to
        # jump directly into Capture or Search. Type matched in
        # MemoryWikiApp's onAppear/handleShortcut.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: wiki.memory.MemoryWiki.capture
            UIApplicationShortcutItemTitle: New Capture
            UIApplicationShortcutItemSubtitle: Type, paste, or photo
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeCompose
          - UIApplicationShortcutItemType: wiki.memory.MemoryWiki.search
            UIApplicationShortcutItemTitle: Search Timeline
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeSearch
          - UIApplicationShortcutItemType: wiki.memory.MemoryWiki.hub
            UIApplicationShortcutItemTitle: Settings
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeShare
    entitlements:
      path: MemoryWiki/MemoryWiki.entitlements
      properties:
        # Sign in with Apple capability — generated by Xcode when
        # the user added the capability under Signing &
        # Capabilities. Listed here so xcodegen rewrites the same
        # file deterministically and the entitlement survives a
        # regenerate. Default scope is fine; per-app-id config
        # lives on the Apple Developer portal.
        com.apple.developer.applesignin:
          - Default
        # App Group so the Share Extension can hand captured
        # content back to the main app + read the shared session
        # the main app wrote to Keychain.
        com.apple.security.application-groups:
          - group.wiki.memory.MemoryWiki
        # Shared keychain access group so SharedSessionStore can
        # be read from both the main app and the extension.
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.wiki.memory.MemoryWiki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wiki.memory.MemoryWiki
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"MemoryWiki/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MemoryWiki/MemoryWiki.entitlements

  MemoryWikiWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "**/Assets.xcassets/**"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      # Explicit buildPhase: resources so xcodegen wires the
      # asset catalog through the actual Copy Bundle Resources
      # build phase (the bare `resources:` block was being
      # silently dropped — the compiled Assets.car never made
      # it into the appex).
      - path: Widget/Assets.xcassets
        buildPhase: resources
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Memory.Wiki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        MWBaseURL: https://memory.wiki
    entitlements:
      path: Widget/MemoryWikiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.wiki.memory.MemoryWiki
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.wiki.memory.MemoryWiki
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wiki.memory.MemoryWiki.Widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/MemoryWikiWidget.entitlements

  ShareExtension:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: ShareExtension
        excludes:
          - "**/.DS_Store"
          - "**/Info.plist"
          - "**/*.js"
          - "**/Assets.xcassets/**"
      - path: Shared
        excludes:
          - "**/.DS_Store"
      # Resources — Share.js + asset catalog both wired through
      # the Copy Bundle Resources phase explicitly.
      - path: ShareExtension/Share.js
        buildPhase: resources
      - path: ShareExtension/Assets.xcassets
        buildPhase: resources
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Memory.Wiki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard Share Extension activation rules + view
        # controller wiring. We accept any number of URLs +
        # plain text. Image / file capture lands in a follow-up
        # commit (camera + photo picker on the main app).
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # WebPage > 0 is what triggers Safari to inject + run
            # Share.js inside the page. Without it (or with the
            # bare WebURL rule alone), iOS routes the share as a
            # plain URL share and the JS preprocessor never runs
            # — that was the "내용이 같이 캡쳐 안 됨" bug.
            #
            # Keep Text support so non-Safari sources that share
            # plain text still trigger the extension.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
            NSExtensionJavaScriptPreprocessingFile: Share
        # MWBaseURL — read by SharedAPI so iOS staging vs prod
        # is a build-config toggle, not a code change.
        MWBaseURL: https://memory.wiki
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.wiki.memory.MemoryWiki
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.wiki.memory.MemoryWiki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wiki.memory.MemoryWiki.Share
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
