# XcodeGen spec — single source of truth for the iOS project.
# Edit this file then run `xcodegen generate` to refresh the
# .xcodeproj. Never hand-edit project.pbxproj.

name: MemoryWiki
options:
  bundleIdPrefix: wiki.memory
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Set DEVELOPMENT_TEAM in your local environment via
    # `xcodebuild -allowProvisioningUpdates` flow or via Xcode
    # Signing & Capabilities — kept out of the spec so the repo
    # has no per-developer state.

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  MemoryWiki:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: MemoryWiki
        excludes:
          - "**/.DS_Store"
    resources:
      - path: MemoryWiki/Assets.xcassets
      - path: MemoryWiki/Preview Content
      - path: MemoryWiki/Fonts
      - path: MemoryWiki/Resources
    info:
      path: MemoryWiki/Info.plist
      properties:
        CFBundleDisplayName: Memory.Wiki
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # memorywiki:// — custom scheme for OAuth callback + share
        # extension hand-off. Universal Links (https://memory.wiki/*)
        # come later via apple-app-site-association on the web app.
        CFBundleURLTypes:
          - CFBundleURLName: wiki.memory.MemoryWiki
            CFBundleURLSchemes: [memorywiki]
        # The web sign-in screen runs in SFSafariViewController;
        # no specific transport-security exception required since
        # everything is https.
        NSCameraUsageDescription: "Memory.Wiki captures photos and screenshots as documents you can paste into any AI."
        NSPhotoLibraryAddUsageDescription: "Save Memory.Wiki documents back to Photos when exporting."
        # Bundled brand fonts — Cal Sans (display, OFL), JetBrains
        # Mono (mono, OFL), Noto Sans (body, OFL). Same family the
        # web app loads via next/font + cdn so iOS chrome reads as a
        # continuation of memory.wiki, not a stock SwiftUI shell.
        UIAppFonts:
          - CalSans-Regular.ttf
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - NotoSans-Regular.ttf
          - NotoSans-Medium.ttf
          - NotoSans-SemiBold.ttf
        # Force the brand's dark zinc treatment at launch — web app
        # default is dark too. Users can override via system Light
        # Mode but the default matches the web canvas.
        UIUserInterfaceStyle: Dark
        # Supabase config — substituted from Config/Secrets.xcconfig
        # at build time. The xcconfig is gitignored; the .example
        # template is checked in.
        MWSupabaseURL: $(MEMORY_WIKI_SUPABASE_URL)
        MWSupabaseAnonKey: $(MEMORY_WIKI_SUPABASE_ANON_KEY)
    entitlements:
      path: MemoryWiki/MemoryWiki.entitlements
      properties:
        # Sign in with Apple capability — generated by Xcode when
        # the user added the capability under Signing &
        # Capabilities. Listed here so xcodegen rewrites the same
        # file deterministically and the entitlement survives a
        # regenerate. Default scope is fine; per-app-id config
        # lives on the Apple Developer portal.
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: wiki.memory.MemoryWiki
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"MemoryWiki/Preview Content\""
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MemoryWiki/MemoryWiki.entitlements
