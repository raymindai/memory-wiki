<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }

    /* ════════════════════════════════════════════════════════════════
       Pure design tokens — verbatim mirror of
       apps/web/src/components/pure/styles/tokens.css
       ──────────────────────────────────────────────────────────────── */
    :root {
      --bg:          #08080a;
      --bg-deep:     #04040a;
      --hair:        rgba(255, 255, 255, 0.08);
      --hair-strong: rgba(255, 255, 255, 0.14);
      --hair-soft:   rgba(255, 255, 255, 0.04);
      --ink:    #fafafa;
      --strong: #ededed;
      --body:   #c2c2c5;
      --muted:  #8a8a92;
      --faint:  #5a5a62;

      /* Micro accents — small visual signals ONLY (dots, badges) */
      --micro-lime:   #B5FF1A;
      --micro-orange: #FF6B1A;
      --micro-ai:     #8B5CF6;

      --r-sm:   10px;
      --r-md:   14px;
      --r-lg:   20px;
      --r-pill: 9999px;

      --font-display: "Cal Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans:    -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

      --ease:   cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: transparent;
      width: 396px;
    }
    body {
      width: 384px;
      margin: 6px;
      background: var(--bg);
      color: var(--body);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.35);
    }

    /* Page enters with a subtle stagger so the sections feel composed,
       not dumped. Each section delays 40 ms past the previous. */
    .stage {
      opacity: 0;
      transform: translateY(4px);
      animation: stage-in 0.32s var(--ease) forwards;
    }
    .stage:nth-child(1) { animation-delay: 0ms; }
    .stage:nth-child(2) { animation-delay: 40ms; }
    .stage:nth-child(3) { animation-delay: 80ms; }
    .stage:nth-child(4) { animation-delay: 120ms; }
    .stage:nth-child(5) { animation-delay: 160ms; }
    .stage:nth-child(6) { animation-delay: 200ms; }
    .stage:nth-child(7) { animation-delay: 240ms; }
    @keyframes stage-in {
      to { opacity: 1; transform: none; }
    }

    a, button { font-family: inherit; letter-spacing: -0.005em; color: inherit; }

    /* ─── 1. Header — eyebrow + wordmark, /about hero shape ─── */
    .header {
      padding: 22px 22px 4px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .eyebrow .num    { color: var(--ink); font-weight: 500; }
    .eyebrow .sep    { color: var(--faint); }
    .eyebrow .v      { margin-left: auto; color: var(--faint); }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .wordmark .mark {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      border-radius: 7px;
      overflow: hidden;
    }
    .wordmark .mark img { width: 100%; height: 100%; display: block; }
    .wordmark .product {
      color: var(--muted);
      font-weight: 500;
    }

    /* ─── 2. Context line ─── */
    .context {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 16px 22px 0;
      font-size: 13px;
      color: var(--muted);
    }
    .context .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
      transition: background 200ms var(--ease);
    }
    .context .dot.live {
      background: var(--micro-lime);
      animation: dot-pulse 2.4s var(--ease) infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(181,255,26,0.45); }
      50%      { box-shadow: 0 0 0 5px rgba(181,255,26,0.00); }
    }
    .context em {
      font-style: normal;
      color: var(--ink);
      font-weight: 500;
    }

    /* ─── 3. Actions ─── */
    .actions {
      padding: 14px 22px 0;
    }

    /* Primary CTA — Pure /about hover-invert pill */
    .btn-primary {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 14px;
      padding: 17px 20px;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--hair-strong);
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 180ms var(--ease), border-color 180ms var(--ease),
                  color 180ms var(--ease), transform 120ms var(--ease);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.992); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: currentColor;
    }
    .btn-primary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .btn-primary .stack { flex: 1; min-width: 0; }
    .btn-primary .stack .title {
      display: block;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .btn-primary .stack .sub {
      display: block;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: -0.005em;
      transition: color 180ms var(--ease);
    }
    .btn-primary:hover:not(:disabled) .stack .sub { color: rgba(8, 8, 10, 0.65); }
    .btn-primary .kbd-inline { flex-shrink: 0; }

    /* Range pills */
    .ranges {
      display: none;
      gap: 6px;
      margin-top: 10px;
    }
    .ranges.visible { display: flex; }
    .ranges label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: var(--r-pill);
      font-size: 10.5px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--hair);
      cursor: pointer;
      transition: color 140ms var(--ease), border-color 140ms var(--ease);
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }
    .ranges label:hover { color: var(--body); border-color: var(--hair-strong); }
    .ranges input { display: none; }
    .ranges label:has(input:checked) { color: var(--ink); border-color: var(--ink); }

    /* Secondary */
    .secondary {
      margin-top: 8px;
      padding: 11px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: transparent;
      border: 1px solid var(--hair);
      border-radius: var(--r-md);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease);
    }
    .secondary:hover {
      background: var(--bg-deep);
      color: var(--ink);
      border-color: var(--hair-strong);
    }
    .secondary .icon { width: 15px; height: 15px; color: var(--faint); }
    .secondary:hover .icon { color: var(--body); }
    .secondary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .secondary .left { display: inline-flex; align-items: center; gap: 11px; flex: 1; min-width: 0; }
    .secondary .kbd-inline { flex-shrink: 0; }

    /* ─── 4. After-capture result card ─── */
    .result {
      margin: 14px 22px 0;
      padding: 0;
      border-radius: var(--r-md);
      border: 1px solid transparent;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 200ms var(--ease), max-height 260ms var(--ease),
                  padding 200ms var(--ease), border-color 200ms var(--ease);
    }
    .result.visible {
      opacity: 1;
      max-height: 300px;
      padding: 14px 16px 14px;
      border-color: var(--hair-strong);
      background: var(--bg-deep);
    }
    .result.error {
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.05);
    }

    .result-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .result.error .result-head { color: #f87171; }
    .result-head .check {
      width: 12px; height: 12px; flex-shrink: 0;
      color: var(--micro-lime);
    }
    .result.error .result-head .check { color: #f87171; }

    .result-url {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink);
      padding: 9px 12px;
      background: var(--bg);
      border: 1px solid var(--hair);
      border-radius: var(--r-sm);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      overflow: hidden;
    }
    .result-url .text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-url-copy {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--hair-strong);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 140ms var(--ease), border-color 140ms var(--ease), background 140ms var(--ease);
    }
    .result-url-copy:hover {
      color: var(--ink);
      border-color: var(--ink);
    }
    .result-url-copy.copied {
      color: var(--bg);
      background: var(--ink);
      border-color: var(--ink);
    }

    .result-cont {
      margin-top: 12px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .result-ai {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .ai-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 12px;
      background: transparent;
      border: 1px solid var(--hair);
      border-radius: var(--r-pill);
      color: var(--body);
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
      transition: background 140ms var(--ease), border-color 140ms var(--ease), color 140ms var(--ease), transform 100ms var(--ease);
    }
    .ai-pill:hover {
      background: var(--bg);
      border-color: var(--hair-strong);
      color: var(--ink);
      transform: translateY(-1px);
    }
    .ai-pill:active { transform: translateY(0); }
    .ai-pill .glyph {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
      color: var(--bg);
    }
    .ai-pill .arrow {
      margin-left: auto;
      color: var(--faint);
      flex-shrink: 0;
      transition: transform 140ms var(--ease), color 140ms var(--ease);
    }
    .ai-pill:hover .arrow {
      color: var(--ink);
      transform: translateX(2px);
    }

    .result-error-text {
      font-size: 12px;
      color: #f87171;
    }

    /* ─── 5. Recent captures ─── */
    .recent-wrap {
      padding: 18px 22px 0;
      display: none;
    }
    .recent-wrap.visible { display: block; }

    .section-eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .section-eyebrow .line {
      flex: 1;
      height: 1px;
      background: var(--hair);
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      margin: 0 -10px;
      border-radius: var(--r-sm);
      text-decoration: none;
      color: var(--body);
      transition: background 120ms var(--ease), color 120ms var(--ease);
      cursor: pointer;
    }
    .recent-item:hover { background: var(--bg-deep); color: var(--ink); }
    .recent-item .src-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
    }
    .recent-item .title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 12.5px;
    }
    .recent-item .ago {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--faint);
      flex-shrink: 0;
      letter-spacing: 0;
    }
    .recent-item .open-arrow {
      width: 12px;
      height: 12px;
      color: var(--faint);
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 140ms var(--ease);
    }
    .recent-item:hover .open-arrow { opacity: 1; color: var(--muted); }
    .recent-item .open-arrow svg { width: 100%; height: 100%; stroke-width: 1.6; }

    .recent-library {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      padding: 6px 0;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.06em;
      color: var(--muted);
      text-decoration: none;
      transition: color 140ms var(--ease);
    }
    .recent-library:hover { color: var(--ink); }
    .recent-library .arrow { transition: transform 140ms var(--ease); }
    .recent-library:hover .arrow { transform: translateX(2px); }

    /* ─── 6. Account row ─── */
    .account-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 22px;
      margin-top: 20px;
      border-top: 1px solid var(--hair);
      font-size: 13px;
      color: var(--body);
      text-decoration: none;
      transition: background 120ms var(--ease);
    }
    .account-row:hover { background: var(--bg-deep); }
    .account-row .avatar {
      width: 26px;
      height: 26px;
      border-radius: 13px;
      background: var(--hair);
      color: var(--body);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11.5px;
      font-weight: 600;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account-row .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .account-row .body-stack {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-row .label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .account-row .name {
      color: var(--ink);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-row .action {
      color: var(--muted);
      font-size: 11px;
      flex-shrink: 0;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: lowercase;
      transition: color 120ms var(--ease);
    }
    .account-row:hover .action { color: var(--ink); }

    /* ─── 7. Footer ─── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 22px 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--hair);
    }
    .footer .also {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }
    .footer .also-label {
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin-right: 2px;
    }
    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 120ms var(--ease);
    }
    .footer a:hover { color: var(--ink); }
    .footer .sep { color: var(--faint); }
    .footer .right {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }

    /* ─── kbd ─── */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--hair-strong);
      border-bottom-width: 1.5px;
      border-radius: 6px;
      background: var(--bg-deep);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0;
    }
    .btn-primary:hover:not(:disabled) .kbd {
      background: rgba(8, 8, 10, 0.85);
      color: var(--ink);
      border-color: rgba(8, 8, 10, 0.95);
    }

    .range-options { display: none; }
    .range-options.visible { display: flex; }
  </style>
</head>
<body>

  <div class="header stage">
    <div class="eyebrow">
      <span class="num">01</span>
      <span class="sep">/</span>
      <span>chrome clipper</span>
      <span class="v">v2.4.0</span>
    </div>
    <a class="wordmark" href="https://memory.wiki" target="_blank" rel="noopener">
      <span class="mark"><img src="icons/icon128.png" alt=""></span>
      <span><span>memory.wiki</span> <span class="product">Clipper</span></span>
    </a>
  </div>

  <div class="context stage" id="context-line">
    <span class="dot" id="context-dot"></span>
    <span id="context-text">detecting page</span>
  </div>

  <div class="actions stage">
    <button class="btn-primary" id="btn-capture" disabled>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>
        </svg>
      </span>
      <span class="stack">
        <span class="title" id="btn-capture-title">capture this page</span>
        <span class="sub" id="btn-capture-sub">clean markdown, shareable URL</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-page">⇧⌘E</span></span>
    </button>

    <div class="ranges range-options" id="range-selector">
      <label><input type="radio" name="range" value="0" checked><span>all</span></label>
      <label><input type="radio" name="range" value="3"><span>last 3</span></label>
      <label><input type="radio" name="range" value="5"><span>last 5</span></label>
      <label><input type="radio" name="range" value="10"><span>last 10</span></label>
    </div>

    <button class="secondary" id="btn-selection">
      <span class="left">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
            <path d="M8 12h8"/>
          </svg>
        </span>
        <span>capture selection</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-sel">⇧⌘X</span></span>
    </button>
  </div>

  <div class="result" id="result">
    <div class="result-head" id="result-head">
      <span class="check">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5l3.5 3.5L13 4.5"/>
        </svg>
      </span>
      <span id="result-head-text">captured</span>
    </div>
    <div class="result-url" id="result-url-box">
      <span class="text" id="result-url-text">memory.wiki/…</span>
      <button class="result-url-copy" id="result-url-copy" type="button">copy</button>
    </div>
