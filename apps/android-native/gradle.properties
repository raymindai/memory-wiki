org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# `buildconfig=true` default was removed in AGP 9.0. Each module
# opts in explicitly via buildFeatures { buildConfig = true }
# in its own build.gradle.kts — `:app` does that already so
# BuildConfig.SUPABASE_URL etc. still generates.

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g

# KSP2 (new compiler-driven KSP architecture) is disabled because
# Hilt 2.52's Gradle plugin looks for the legacy `KspTaskJvm` class
# and Class.forName fails under KSP2 → "KSP plugin detected but its
# task class could not be found". Once we move to Hilt 2.53+ this
# can be flipped back on.
ksp.useKSP2=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
