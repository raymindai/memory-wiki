org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# `buildconfig=true` default was removed in AGP 9.0. Each module
# opts in explicitly via buildFeatures { buildConfig = true }
# in its own build.gradle.kts — `:app` does that already so
# BuildConfig.SUPABASE_URL etc. still generates.

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx2g

ksp.useKSP2=true
