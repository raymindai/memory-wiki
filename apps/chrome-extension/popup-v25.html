<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700; font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400 600; font-display: swap;
    }

    :root {
      --bg:          #08080a;
      --bg-deep:     #04040a;
      --bg-card:     #0d0d11;
      --hair:        rgba(255, 255, 255, 0.08);
      --hair-strong: rgba(255, 255, 255, 0.14);
      --ink:    #fafafa;
      --strong: #ededed;
      --body:   #c2c2c5;
      --muted:  #8a8a92;
      --faint:  #5a5a62;

      --micro-lime:   #B5FF1A;
      --micro-orange: #FF6B1A;
      --micro-ai:     #8B5CF6;

      --c-chatgpt:    #10A37F;
      --c-claude:     #CC785C;
      --c-gemini-a:   #4285F4;
      --c-gemini-b:   #9B72CB;
      --c-gemini-c:   #D96570;
      --c-perplexity: #20B8CD;

      --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-pill: 9999px;
      --font-display: "Cal Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans:    -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --ease:         cubic-bezier(0.16, 1, 0.3, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: transparent; width: 396px; overflow: hidden; }
    body {
      width: 384px;
      margin: 6px;
      background: var(--bg);
      color: var(--body);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.35);
    }

    /* Body sizes to content; chrome popup auto-sizes to body.
       Foot has a small margin-top so it sits just below the ask
       textarea, not glued to it. */
    .foot { margin-top: 16px; }
    body.signed-out .promo-strip { display: none; }

    /* ─── Signed-out: capture controls dimmed, dark hover overlay ─── */
    body.signed-out .cta { opacity: 0.18; cursor: pointer; }
    body.signed-out .cta-secondary,
    body.signed-out .ask-input-wrap,
    body.signed-out .ask-submit { opacity: 0.4; cursor: pointer; }

    /* Hover overlay on the primary CTA */
    body.signed-out .cta { position: relative; overflow: hidden; }
    body.signed-out .cta::after {
      content: "Sign in to capture";
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8, 8, 10, 0.82);
      backdrop-filter: blur(4px);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 160ms var(--ease);
      border-radius: var(--r-md);
      pointer-events: none;
    }
    body.signed-out .cta:hover { opacity: 1; }
    body.signed-out .cta:hover::after { opacity: 1; }

    /* Hover hint on the ask textarea */
    body.signed-out .ask-input-wrap { position: relative; }
    body.signed-out .ask-input-wrap::after {
      content: "Sign in to ask AI";
      position: absolute;
      inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(8, 8, 10, 0.82);
      backdrop-filter: blur(4px);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      opacity: 0;
      transition: opacity 160ms var(--ease);
      border-radius: var(--r-md);
      pointer-events: none;
    }
    body.signed-out .ask-input-wrap:hover::after { opacity: 1; }

    /* Secondary subtle hover */
    body.signed-out .cta-secondary { transition: color 160ms; }
    body.signed-out .cta-secondary:hover { opacity: 1; color: var(--ink); }
    body.signed-out .cta-secondary:hover > span:first-child::after {
      content: " — sign in first";
      color: var(--muted);
      font-size: 11px;
      margin-left: 2px;
    }

    /* Ambient blurred blob — soft brand presence behind everything */
    body::before {
      content: "";
      position: absolute;
      inset: -30% -25% 20% -25%;
      background: url("icons/icon128.png") no-repeat 30% 18% / 70%;
      filter: blur(50px);
      opacity: 0.13;
      z-index: 0;
      pointer-events: none;
    }
    body::after {
      content: "";
      position: absolute;
      inset: 40% -25% -30% 25%;
      background: radial-gradient(circle at 50% 50%, rgba(139,92,246,0.20), transparent 60%);
      filter: blur(36px);
      opacity: 0.55;
      z-index: 0;
      pointer-events: none;
    }
    body > * { position: relative; z-index: 1; }

    a, button { font-family: inherit; letter-spacing: -0.005em; color: inherit; text-decoration: none; }
    button, input, textarea { background: transparent; border: none; cursor: pointer; outline: none; font-family: inherit; }
    textarea { cursor: text; }

    /* ─── Brand bar ─── */
    .brand-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 24px 0;
    }
    .brand-left {
      display: inline-flex; align-items: center; gap: 9px;
      text-decoration: none;
    }
    .brand-mark { width: 22px; height: 22px; color: var(--ink); display: inline-flex; }
    .brand-mark svg { width: 100%; height: 100%; display: block; }
    .brand-word {
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .brand-product {
      color: var(--muted);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.005em;
      margin-left: 2px;
    }
    .brand-v {
      font-family: var(--font-mono);
      font-size: 9.5px; color: var(--faint);
      letter-spacing: 0.16em; text-transform: uppercase;
    }

    /* ─── Hero (compact) ─── */
    .hero { padding: 14px 24px 0; }
    .hero .line {
      font-family: var(--font-display);
      font-size: 32px; font-weight: 600;
      line-height: 1.0; letter-spacing: -0.025em;
      color: var(--ink);
    }

    /* ─── Primary CTA — ink fill, full width ─── */
    .cta {
      margin: 16px 24px 0;
      width: calc(100% - 48px);
      display: flex; align-items: center; justify-content: center; gap: 14px;
      padding: 14px 18px;
      background: var(--ink);
      color: var(--bg);
      border: 1px solid var(--ink);
      border-radius: var(--r-md);
      font-family: var(--font-display);
      font-size: 16px; font-weight: 600;
      letter-spacing: -0.005em;
      cursor: pointer;
      transition: filter 140ms var(--ease), transform 100ms var(--ease);
    }
    .cta:hover:not(:disabled) { filter: brightness(0.95); }
    .cta:active:not(:disabled) { transform: scale(0.995); }
    .cta:disabled { opacity: 0.35; cursor: not-allowed; }
    .cta .kbd {
      font-family: var(--font-mono);
      font-size: 10.5px; font-weight: 500;
      color: var(--bg);
      padding: 3px 8px;
      background: rgba(8,8,10,0.12);
      border-radius: 5px;
      letter-spacing: 0.06em;
    }

    .cta-secondary-wrap {
      margin: 8px 24px 0;
      display: flex; align-items: center; justify-content: center;
    }
    .cta-secondary {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 5px 12px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: color 140ms;
    }
    .cta-secondary:hover { color: var(--ink); }
    .cta-secondary .kbd {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--faint); letter-spacing: 0.06em;
    }

    /* ─── AI free-form prompt ─── */
    .ask-head {
      margin: 18px 24px 6px;
      font-family: var(--font-mono);
      font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--faint);
      display: flex; align-items: center; gap: 10px;
    }
    .ask-head .grow { flex: 1; height: 1px; background: var(--hair); }

    .ask-input-wrap {
      margin: 0 24px;
      position: relative;
      background: rgba(13, 13, 17, 0.55);
      backdrop-filter: blur(8px);
      border: 1px solid var(--hair);
      border-radius: var(--r-md);
      transition: border-color 140ms, box-shadow 140ms;
    }
    .ask-input-wrap:focus-within {
      border-color: var(--micro-lime);
      box-shadow: 0 0 0 3px rgba(181,255,26,0.08);
    }
    .ask-input-wrap textarea {
      width: 100%;
      color: var(--ink);
      font-size: 12.5px; letter-spacing: -0.005em;
      line-height: 1.4;
      padding: 10px 12px 34px;
      resize: none;
      min-height: 58px;
      display: block;
    }
    .ask-input-wrap textarea::placeholder { color: var(--muted); }
    .ask-submit {
      position: absolute;
      right: 8px; bottom: 8px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 11px;
      background: var(--micro-lime);
      color: #0a0a0a;
      border-radius: var(--r-pill);
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer;
      transition: filter 140ms;
    }
    .ask-submit:hover { filter: brightness(0.93); }
    .ask-submit:disabled { background: var(--hair); color: var(--faint); cursor: not-allowed; }

    /* ─── Result card ─── */
    .result {
      margin: 14px 24px 0;
      padding: 0;
      border-radius: var(--r-md);
      border: 1px solid transparent;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: opacity 200ms var(--ease), max-height 260ms var(--ease),
                  padding 200ms var(--ease), border-color 200ms var(--ease);
    }
    .result.visible {
      opacity: 1;
      max-height: 360px;
      padding: 14px 16px;
      border-color: var(--hair-strong);
      background: rgba(13, 13, 17, 0.55);
      backdrop-filter: blur(8px);
    }
    .result.error {
      border-color: rgba(239, 68, 68, 0.25);
      background: rgba(239, 68, 68, 0.05);
    }
    .result-head {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .result.error .result-head { color: #f87171; }
    .result-head .check { width: 12px; height: 12px; flex-shrink: 0; color: var(--micro-lime); }
    .result.error .result-head .check { color: #f87171; }
    .result-url {
      font-family: var(--font-mono);
      font-size: 12px; color: var(--ink);
      padding: 9px 12px;
      background: var(--bg);
      border: 1px solid var(--hair);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .result-url .text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .result-url-copy {
      flex-shrink: 0;
      background: transparent;
      border: 1px solid var(--hair-strong);
      color: var(--muted);
      border-radius: 6px;
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 10px; letter-spacing: 0.06em;
      cursor: pointer;
      transition: color 140ms, border-color 140ms, background 140ms;
    }
    .result-url-copy:hover { color: var(--ink); border-color: var(--ink); }
    .result-url-copy.copied { color: var(--bg); background: var(--ink); border-color: var(--ink); }
    .result-cont {
      margin-top: 12px;
      font-size: 10px; color: var(--muted);
      font-family: var(--font-mono); letter-spacing: 0.12em; text-transform: uppercase;
    }
    .result-ai { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .ai-pill {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 9px 12px;
      background: var(--bg-card);
      border: 1px solid var(--hair);
      border-radius: var(--r-md);
      color: var(--body);
      font-size: 12.5px;
      cursor: pointer;
      transition: border-color 140ms, background 140ms, transform 100ms;
    }
    .ai-pill:hover { border-color: var(--hair-strong); background: #111116; color: var(--ink); transform: translateY(-1px); }
    .ai-pill .ai-mark {
      flex-shrink: 0;
      width: 22px; height: 22px;
      border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .ai-pill .ai-mark svg { width: 14px; height: 14px; }
    .ai-pill[data-ai="chatgpt"]    .ai-mark { background: var(--c-chatgpt); }
    .ai-pill[data-ai="claude"]     .ai-mark { background: var(--c-claude); }
    .ai-pill[data-ai="gemini"]     .ai-mark { background: conic-gradient(from 200deg at 50% 50%, var(--c-gemini-a), var(--c-gemini-b), var(--c-gemini-c), var(--c-gemini-a)); }
    .ai-pill[data-ai="perplexity"] .ai-mark { background: var(--c-perplexity); }
    .ai-pill .ai-name { flex: 1; min-width: 0; }
    .result-error-text { font-size: 12px; color: #f87171; }

    /* ─── Recent ─── */
    .sec-head {
      margin: 18px 24px 6px;
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-mono);
      font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--faint);
    }
    .sec-head .count { color: var(--muted); }
    .sec-head .grow { flex: 1; height: 1px; background: var(--hair); }

    .recent-wrap { display: none; }
    .recent-wrap.visible { display: block; }
    .recent-list { margin: 0 24px; display: flex; flex-direction: column; }
    .recent {
      position: relative;
      display: flex; align-items: center; gap: 11px;
      margin: 0 -10px;
      padding: 8px 10px;
      border-radius: var(--r-sm);
      cursor: pointer;
      transition: background 120ms;
    }
    .recent:hover { background: rgba(13, 13, 17, 0.6); }
    .recent .stack { flex: 1; min-width: 0; }
    .recent .t {
      color: var(--ink);
      font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.35;
    }
    .recent .ago {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--faint); letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .library-row {
      display: flex; align-items: center; gap: 10px;
      margin: 6px -10px 0;
      padding: 9px 10px;
      border-top: 1px solid var(--hair);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: color 120ms;
    }
    .library-row .lmark { width: 14px; height: 14px; color: var(--ink); display: inline-flex; flex-shrink: 0; }
    .library-row .lmark svg { width: 100%; height: 100%; }
    .library-row:hover { color: var(--ink); }
    .library-row .grow { flex: 1; }
    .library-row .kbd {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--faint);
      padding: 2px 6px;
      border: 1px solid var(--hair);
      border-radius: 5px;
      letter-spacing: 0.04em;
    }
    .library-row .arrow { transition: transform 140ms; }
    .library-row:hover .arrow { transform: translateX(2px); }

    /* ─── Cross-promo — small chip buttons (below footer when signed in) ─── */
    .promo-strip {
      margin: 0 24px;
      padding: 12px 0 16px;
      display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
    }
    .promo-strip .label {
      color: var(--faint);
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-right: 4px;
    }
    .promo-strip a {
      display: inline-flex; align-items: center;
      color: var(--body);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.04em;
      padding: 4px 10px;
      border: 1px solid var(--hair);
      border-radius: var(--r-pill);
      transition: color 120ms, border-color 120ms, background 120ms;
    }
    .promo-strip a:hover {
      color: var(--ink);
      border-color: var(--hair-strong);
      background: var(--bg-card);
    }

    /* ─── Footer — signed-out / signed-in two states ─── */
    .foot {
      margin-top: 12px;
      padding: 12px 24px;
      border-top: 1px solid var(--hair);
      display: flex; align-items: center; gap: 11px;
      font-size: 12px;
      transition: background 140ms;
    }
    .foot:hover { background: rgba(13,13,17,0.4); }

    /* Avatar — only shown when signed in */
    .foot .av {
      width: 26px; height: 26px; border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--micro-orange), var(--micro-ai));
    }
    .foot .av svg { width: 100%; height: 100%; display: block; }
    .foot .stack { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
    .foot .name {
      color: var(--ink); font-size: 12.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      line-height: 1.3;
    }
    .foot .plan {
      color: var(--muted); font-size: 10px;
      font-family: var(--font-mono); letter-spacing: 0.06em;
      line-height: 1.3;
    }
    .foot .act {
      font-family: var(--font-mono);
      font-size: 10px; color: var(--faint); letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: color 120ms;
    }
    .foot:hover .act { color: var(--ink); }

    /* Signed-out state — strip down to a single full-width Sign-in pill */
    .foot.signin {
      padding: 12px 24px;
      justify-content: center;
    }
    .foot.signin .av,
    .foot.signin .stack { display: none; }
    .foot.signin .act {
      width: 100%;
      text-align: center;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--font-display);
      font-size: 14px; font-weight: 600;
      letter-spacing: -0.005em;
      padding: 11px 16px;
      border-radius: var(--r-md);
      text-transform: none;
      transition: filter 140ms;
    }
    .foot.signin:hover { background: transparent; }
    .foot.signin:hover .act { filter: brightness(0.94); }

    .hidden-stub { display: none !important; }
  </style>
</head>
