<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --canvas:        #09090b;
      --surface:       #131318;
      --surface-hover: #1a1a20;
      --surface-press: #21212a;
      --border-faint:  rgba(255,255,255,0.06);
      --border:        rgba(255,255,255,0.10);
      --text-primary:  #f4f4f5;
      --text-secondary:#a1a1aa;
      --text-muted:    #71717a;
      --text-faint:    #52525b;
      --micro-info:    #60a5fa;
      --micro-ok:      #B5FF1A;
      --radius-window: 14px;
      --radius-card:   12px;
      --radius-pill:   999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Round the popup window itself. Chrome 117+ honors radius on html
       so the corners are clipped at the OS layer. Older Chromes show
       a small gap (acceptable). */
    html {
      border-radius: var(--radius-window);
      overflow: hidden;
      background: var(--canvas);
    }
    body {
      width: 340px;
      background: var(--canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      border-radius: var(--radius-window);
      overflow: hidden;
    }

    a, button { font-family: inherit; letter-spacing: 0; }

    /* ─── top bar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 14px;
      gap: 10px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: "Cal Sans", -apple-system, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1;
    }
    .wordmark .blob { width: 20px; height: 20px; flex-shrink: 0; display: inline-block; }
    .wordmark .blob img { width: 100%; height: 100%; display: block; }

    .account {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 4px 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border-faint);
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: none;
      max-width: 200px;
      transition: background 0.12s, border-color 0.12s;
    }
    .account:hover { background: var(--surface-hover); border-color: var(--border); }
    .account .label {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account .avatar {
      width: 20px;
      height: 20px;
      border-radius: 10px;
      background: var(--surface-press);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ─── context line ─── */
    .context {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 0 18px 16px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .context .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
    }
    .context .dot.live { background: var(--micro-ok); }

    /* ─── actions ─── */
    .actions { padding: 0 18px 16px; }

    .btn-primary {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border-faint);
      border-radius: var(--radius-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, transform 0.06s;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border);
    }
    .btn-primary:active:not(:disabled) { background: var(--surface-press); transform: scale(0.995); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: var(--text-secondary);
    }
    .btn-primary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .btn-primary .stack { flex: 1; min-width: 0; }
    .btn-primary .stack .title { display: block; font-weight: 600; }
    .btn-primary .stack .sub {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0;
    }
    .btn-primary .kbd-inline { flex-shrink: 0; }

    /* ─── range pills (only when AI conversation) ─── */
    .ranges {
      display: none;
      gap: 5px;
      margin-top: 8px;
    }
    .ranges.visible { display: flex; }
    .ranges label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border-faint);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .ranges label:hover { background: var(--surface-hover); color: var(--text-secondary); }
    .ranges input { display: none; }
    .ranges label:has(input:checked) {
      background: var(--surface-press);
      color: var(--text-primary);
      border-color: var(--border);
    }

    /* ─── secondary action ─── */
    .secondary {
      margin-top: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border-faint);
      border-radius: var(--radius-card);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .secondary:hover { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
    .secondary .icon { width: 16px; height: 16px; color: var(--text-muted); }
    .secondary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .secondary .left { display: inline-flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .secondary .kbd-inline { flex-shrink: 0; }

    /* ─── status toast ─── */
    .status {
      margin: 10px 18px 0;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      text-align: center;
      min-height: 0;
      opacity: 0;
      transition: opacity 0.15s, min-height 0.15s;
    }
    .status:not(:empty) { opacity: 1; min-height: 30px; padding-top: 9px; padding-bottom: 9px; }
    .status.success { background: rgba(181, 255, 26, 0.08); color: var(--micro-ok); }
    .status.info    { background: var(--surface); color: var(--text-secondary); }
    .status.error   { background: rgba(239, 68, 68, 0.08); color: #f87171; }

    /* ─── footer ─── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px 16px;
      margin-top: 14px;
      border-top: 1px solid var(--border-faint);
      font-size: 11px;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.1s;
    }
    .footer a:hover { color: var(--text-primary); }
    .footer .right { display: inline-flex; gap: 14px; }

    /* ─── kbd hint ─── */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      border: 1px solid var(--border-faint);
      border-bottom-width: 1.5px;
      border-radius: 6px;
      background: rgba(0,0,0,0.25);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    /* legacy compatibility */
    .range-options { display: none; }
    .range-options.visible { display: flex; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="https://memory.wiki" target="_blank" rel="noopener">
      <span class="blob"><img src="blob.svg" alt=""></span>
      <span>memory.wiki</span>
    </a>
    <a class="account" id="account-chip" href="#" title="">
      <span class="avatar" id="account-avatar">?</span>
      <span class="label" id="account-info">checking</span>
    </a>
  </div>

  <div class="context" id="context-line">
    <span class="dot" id="context-dot"></span>
    <span id="context-text">detecting page</span>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-capture" disabled>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>
        </svg>
      </span>
      <span class="stack">
        <span class="title" id="btn-capture-title">capture this page</span>
        <span class="sub" id="btn-capture-sub">clean markdown, shareable URL</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-page">⇧⌘E</span></span>
    </button>

    <div class="ranges range-options" id="range-selector">
      <label><input type="radio" name="range" value="0" checked><span>all</span></label>
      <label><input type="radio" name="range" value="3"><span>last 3</span></label>
      <label><input type="radio" name="range" value="5"><span>last 5</span></label>
      <label><input type="radio" name="range" value="10"><span>last 10</span></label>
    </div>

    <button class="secondary" id="btn-selection">
      <span class="left">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
            <path d="M8 12h8"/>
          </svg>
        </span>
        <span>capture selection</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-sel">⇧⌘X</span></span>
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="footer">
    <a href="https://memory.wiki" target="_blank" rel="noopener">memory.wiki</a>
    <span class="right">
      <a href="#" id="link-settings">settings</a>
      <a href="https://memory.wiki/about" target="_blank" rel="noopener">about</a>
    </span>
  </div>

  <!-- legacy stub spans referenced by popup.js (now invisible). -->
  <span id="search-input" style="display:none"></span>
  <span id="search-results" style="display:none"></span>
  <span id="platform-badge" style="display:none"></span>
  <span id="platform-dot" style="display:none"></span>
  <span id="platform-name" style="display:none"></span>
  <span id="platform-hint" style="display:none"></span>
  <span id="account-action" style="display:none"></span>

  <script src="popup.js"></script>
</body>
</html>
