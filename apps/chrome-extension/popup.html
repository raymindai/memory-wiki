<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* Pure ink palette. No lime anywhere. Warm orange is the
         canonical brand color (mark uses it) — used here only on a
         single 5 px "live" dot and the success state ring. Buttons,
         text, surfaces stay ink. */
      --canvas:        #09090b;
      --surface:       rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.06);
      --surface-press: rgba(255,255,255,0.10);
      --border-faint:  rgba(255,255,255,0.06);
      --border:        rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.22);
      --text-primary:  #fafafa;
      --text-secondary:#a1a1aa;
      --text-muted:    #71717a;
      --text-faint:    #52525b;
      --brand:         #fb923c;
      --brand-tint:    rgba(251, 146, 60, 0.18);
      --radius-window: 18px;
      --radius-card:   12px;
      --radius-pill:   999px;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: transparent;
      width: 372px;
    }
    body {
      width: 360px;
      margin: 6px;
      background: var(--canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      border-radius: var(--radius-window);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 20px 60px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.35);
      animation: pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    a, button { font-family: inherit; letter-spacing: 0; color: inherit; }

    /* ─── header — wordmark only, no account chip up here ─── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px 20px 12px;
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: "Cal Sans", -apple-system, sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1;
      flex: 1;
      min-width: 0;
    }
    .wordmark .mark {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: inline-block;
      border-radius: 5px;
      overflow: hidden;
    }
    .wordmark .mark img { width: 100%; height: 100%; display: block; }
    .wordmark .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wordmark .sub {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 2px;
      letter-spacing: 0;
    }

    /* ─── context line ─── */
    .context {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px 14px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .context .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .context .dot.live {
      background: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-tint);
    }
    .context em {
      font-style: normal;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ─── actions ─── */
    .actions { padding: 0 20px 16px; }

    /* PRIMARY: ink-filled. Reads as the most confident action. */
    .btn-primary {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      background: #f4f4f5;
      border: 1px solid #f4f4f5;
      border-radius: var(--radius-card);
      color: #18181b;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.14s, border-color 0.14s, transform 0.08s, box-shadow 0.14s;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    }
    .btn-primary:hover:not(:disabled) {
      background: #ffffff;
      border-color: #ffffff;
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.992); }
    .btn-primary:disabled {
      background: var(--surface);
      border-color: var(--border-faint);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-primary .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: #18181b;
    }
    .btn-primary:disabled .icon { color: var(--text-muted); }
    .btn-primary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .btn-primary .stack { flex: 1; min-width: 0; }
    .btn-primary .stack .title { display: block; font-weight: 600; line-height: 1.3; }
    .btn-primary .stack .sub {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: rgba(24,24,27,0.55);
      margin-top: 2px;
      letter-spacing: 0;
    }
    .btn-primary:disabled .stack .sub { color: var(--text-faint); }
    .btn-primary .kbd-inline { flex-shrink: 0; }

    /* ─── range pills ─── */
    .ranges {
      display: none;
      gap: 6px;
      margin-top: 10px;
    }
    .ranges.visible { display: flex; }
    .ranges label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border-faint);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .ranges label:hover { background: var(--surface-hover); color: var(--text-secondary); }
    .ranges input { display: none; }
    .ranges label:has(input:checked) {
      background: var(--surface-press);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* SECONDARY: outline, neutral text */
    .secondary {
      margin-top: 8px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border-faint);
      border-radius: var(--radius-card);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .secondary:hover { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
    .secondary .icon { width: 16px; height: 16px; color: var(--text-muted); }
    .secondary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .secondary .left { display: inline-flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .secondary .kbd-inline { flex-shrink: 0; }

    /* ─── status — neutral ink card, no color floods ─── */
    .status {
      margin: 12px 20px 0;
      padding: 0;
      border-radius: 10px;
      font-size: 11.5px;
      text-align: center;
      min-height: 0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.2s, max-height 0.2s, padding 0.2s;
    }
    .status:not(:empty) {
      opacity: 1;
      padding: 10px 14px;
      max-height: 80px;
    }
    .status.success {
      background: var(--surface);
      border: 1px solid var(--brand-tint);
      color: var(--text-primary);
      font-family: var(--mono);
    }
    .status.info {
      background: var(--surface);
      border: 1px solid var(--border-faint);
      color: var(--text-secondary);
    }
    .status.error {
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.20);
      color: #f87171;
    }

    /* ─── account row in footer (long names safe) ─── */
    .account-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 20px 12px;
      margin-top: 16px;
      border-top: 1px solid var(--border-faint);
      font-size: 12px;
      color: var(--text-secondary);
      text-decoration: none;
      transition: background 0.1s;
    }
    .account-row:hover { background: var(--surface); }
    .account-row .avatar {
      width: 22px;
      height: 22px;
      border-radius: 11px;
      background: var(--surface-press);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account-row .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .account-row .body {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .account-row .label {
      font-size: 9.5px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-family: var(--mono);
    }
    .account-row .name {
      color: var(--text-primary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-row .action {
      color: var(--text-muted);
      font-size: 11px;
      flex-shrink: 0;
    }
    .account-row.signin .name { color: var(--text-primary); }
    .account-row.signin .label { color: var(--text-faint); }

    /* ─── footer with cross-promo as text links ─── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 20px 14px;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-faint);
    }
    .footer .also {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
    }
    .footer .also .also-label {
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-faint);
      margin-right: 4px;
    }
    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.1s;
    }
    .footer a:hover { color: var(--text-primary); }
    .footer .sep {
      color: var(--text-faint);
      margin: 0 2px;
    }
    .footer .right { display: inline-flex; align-items: center; gap: 10px; }

    /* ─── kbd ─── */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-bottom-width: 1.5px;
      border-radius: 6px;
      background: rgba(0,0,0,0.45);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-secondary);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
    }
    /* kbd on the white primary button shows ink ink not ink-on-ink */
    .btn-primary:not(:disabled) .kbd {
      background: rgba(24, 24, 27, 0.85);
      color: #f4f4f5;
      border-color: rgba(24, 24, 27, 0.9);
    }

    /* legacy compatibility */
    .range-options { display: none; }
    .range-options.visible { display: flex; }
  </style>
</head>
<body>
  <div class="header">
    <a class="wordmark" href="https://memory.wiki" target="_blank" rel="noopener">
      <span class="mark"><img src="icons/icon128.png" alt=""></span>
      <span class="name">memory.wiki <span class="sub">Clipper</span></span>
    </a>
  </div>

  <div class="context" id="context-line">
    <span class="dot" id="context-dot"></span>
    <span id="context-text">detecting page</span>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-capture" disabled>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>
        </svg>
      </span>
      <span class="stack">
        <span class="title" id="btn-capture-title">capture this page</span>
        <span class="sub" id="btn-capture-sub">clean markdown, shareable URL</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-page">⇧⌘E</span></span>
    </button>

    <div class="ranges range-options" id="range-selector">
      <label><input type="radio" name="range" value="0" checked><span>all</span></label>
      <label><input type="radio" name="range" value="3"><span>last 3</span></label>
      <label><input type="radio" name="range" value="5"><span>last 5</span></label>
      <label><input type="radio" name="range" value="10"><span>last 10</span></label>
    </div>

    <button class="secondary" id="btn-selection">
      <span class="left">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
            <path d="M8 12h8"/>
          </svg>
        </span>
        <span>capture selection</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-sel">⇧⌘X</span></span>
    </button>

    <div class="status" id="status"></div>
  </div>

  <a class="account-row" id="account-chip" href="#">
    <span class="avatar" id="account-avatar">?</span>
    <span class="body">
      <span class="label">account</span>
      <span class="name" id="account-info">checking</span>
    </span>
    <span class="action" id="account-action-label">sign out</span>
  </a>

  <div class="footer">
    <span class="also">
      <span class="also-label">also</span>
      <a href="https://github.com/raymindai/memory-wiki/releases?q=desktop" target="_blank" rel="noopener" title="memory.wiki for Mac">mac</a>
      <span class="sep">·</span>
      <a href="https://marketplace.visualstudio.com/items?itemName=raymindai.memory-wiki-vscode" target="_blank" rel="noopener" title="memory.wiki for VS Code">vscode</a>
      <span class="sep">·</span>
      <a href="https://www.npmjs.com/package/memory-wiki-cli" target="_blank" rel="noopener" title="memory.wiki CLI + MCP">cli</a>
    </span>
    <span class="right">
      <a href="#" id="link-settings">settings</a>
      <a href="https://memory.wiki/about" target="_blank" rel="noopener">about</a>
    </span>
  </div>

  <!-- legacy stubs popup.js may still write to -->
  <span id="search-input" style="display:none"></span>
  <span id="search-results" style="display:none"></span>
  <span id="platform-badge" style="display:none"></span>
  <span id="platform-dot" style="display:none"></span>
  <span id="platform-name" style="display:none"></span>
  <span id="platform-hint" style="display:none"></span>

  <script src="popup.js"></script>
</body>
</html>
