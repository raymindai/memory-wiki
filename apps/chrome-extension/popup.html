<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 320px;
      background: #0a0a0c;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Account chip (top of popup) */
    .account-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      border-bottom: 1px solid #141416;
      background: #0d0d10;
      font-size: 10px;
      color: #a1a1aa;
      min-height: 34px;
    }
    .account-chip .avatar {
      width: 18px;
      height: 18px;
      border-radius: 9px;
      background: #1c1c20;
      color: #71717a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .account-chip .avatar.active {
      background: rgba(181, 255, 26, 0.15);
      color: #B5FF1A;
    }
    .account-chip .info {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }
    .account-chip .info .email {
      color: #e4e4e7;
      font-weight: 500;
    }
    .account-chip .info .label { color: #71717a; }
    .account-chip .action {
      color: #71717a;
      text-decoration: none;
      font-size: 10px;
      flex-shrink: 0;
      padding: 3px 7px;
      border-radius: 4px;
      transition: color 0.1s, background 0.1s;
    }
    .account-chip .action:hover { color: #e4e4e7; background: rgba(255,255,255,0.04); }
    .account-chip .action.cta { color: #B5FF1A; }
    .account-chip .action.cta:hover { background: rgba(181, 255, 26, 0.08); }

    /* Header */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 16px 16px 12px;
    }

    .wordmark {
      font-family: "Cal Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #e4e4e7;
      text-decoration: none;
      line-height: 1;
    }
    .wordmark .dot { color: #B5FF1A; }

    .header-meta { text-align: right; }

    .tagline {
      font-size: 9px;
      color: #a1a1aa;
      font-weight: 500;
    }

    .detection {
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: flex-end;
      margin-top: 3px;
    }
    .detection-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
    }
    .detection-dot.active { background: #B5FF1A; }
    .detection-dot.inactive { background: #27272a; }
    .detection-text {
      font-size: 9px;
      color: #71717a;
    }
    .detection-text.active { color: #a1a1aa; }

    .platform-hint { display: none; }

    /* Main */
    .main { padding: 0 16px 14px; }

    /* Capture card */
    .capture-card {
      border: 1px solid #1c1c20;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    /* Range radio */
    .range-options {
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid #1c1c20;
      background: #0f0f12;
    }
    .range-options label {
      flex: 1;
      min-width: calc(50% - 2px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px 0;
      border-radius: 5px;
      font-size: 10px;
      color: #71717a;
      cursor: pointer;
      transition: all 0.1s;
      border: 1px solid transparent;
    }
    .range-options label:hover {
      color: #71717a;
      background: rgba(255,255,255,0.02);
    }
    .range-options input[type="radio"] { display: none; }
    .range-options input[type="radio"]:checked + span { color: #B5FF1A; }
    .range-options label:has(input:checked) {
      border-color: rgba(181, 255, 26, 0.2);
      background: rgba(181, 255, 26, 0.05);
    }

    /* Capture button */
    .capture-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 11px 12px;
      background: none;
      border: none;
      color: #B5FF1A;
      font-size: 12px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s;
      text-align: left;
    }
    .capture-btn:hover:not(:disabled) { background: rgba(181, 255, 26, 0.06); }
    .capture-btn:active:not(:disabled) { background: rgba(181, 255, 26, 0.1); }
    .capture-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .capture-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke-width: 1.75;
      opacity: 0.8;
    }
    .capture-btn .label { flex: 1; }
    .capture-btn .desc {
      display: block;
      font-size: 9px;
      font-weight: 400;
      color: rgba(181, 255, 26, 0.5);
      margin-top: 1px;
    }

    /* Selection button */
    .selection-card {
      border: 1px solid #1c1c20;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .selection-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: none;
      border: none;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.1s;
      text-align: left;
    }
    .selection-btn:hover { background: rgba(255,255,255,0.02); }
    .selection-btn:active { background: rgba(255,255,255,0.04); }
    .selection-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      stroke-width: 1.75;
      opacity: 0.5;
    }
    .selection-btn .desc {
      display: block;
      font-size: 9px;
      font-weight: 400;
      color: #737373;
      margin-top: 1px;
    }

    /* Status */
    .status {
      font-size: 10px;
      color: #71717a;
      text-align: center;
      min-height: 12px;
      margin-top: 6px;
      transition: color 0.15s;
    }
    .status.success { color: #B5FF1A; }
    .status.error { color: #ef4444; }

    /* Shortcuts row */
    .shortcuts {
      padding: 10px 16px 12px;
      border-top: 1px solid #141416;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .shortcuts-label {
      font-size: 8px;
      font-weight: 700;
      color: #737373;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }
    .shortcut-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 10px;
      color: #a1a1aa;
    }
    .shortcut-row .keys {
      display: inline-flex;
      gap: 3px;
      flex-shrink: 0;
    }
    .kbd {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border: 1px solid #1c1c20;
      border-bottom-width: 2px;
      border-radius: 4px;
      background: #0f0f12;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 9px;
      color: #a1a1aa;
    }

    /* Search */
    .search-section {
      padding: 8px 16px;
      border-top: 1px solid #141416;
    }
    .search-input {
      width: 100%;
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #27272a;
      background: #0f0f12;
      color: #e4e4e7;
      font-size: 11px;
      outline: none;
      font-family: inherit;
    }
    .search-input:focus { border-color: rgba(181, 255, 26, 0.3); }
    .search-results {
      margin-top: 6px;
      max-height: 160px;
      overflow-y: auto;
    }

    /* Footer */
    .footer {
      padding: 8px 16px 10px;
      border-top: 1px solid #18181b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .footer a {
      color: #737373;
      font-size: 10px;
      text-decoration: none;
      transition: color 0.1s;
    }
    .footer a:hover { color: #B5FF1A; }
    .footer .footer-right { display: flex; gap: 12px; }
  </style>
</head>
<body>
  <div class="account-chip" id="account-chip">
    <span class="avatar" id="account-avatar">?</span>
    <span class="info" id="account-info"><span class="label">checking sign-in</span></span>
    <a class="action" id="account-action" href="#"></a>
  </div>

  <div class="header">
    <a class="wordmark" href="https://memory.wiki" target="_blank">memory<span class="dot">.</span>wiki</a>
    <div class="header-meta">
      <div class="tagline">your AI memory, paste anywhere</div>
      <div class="detection" id="platform-badge">
        <span class="detection-dot inactive" id="platform-dot"></span>
        <span class="detection-text" id="platform-name">detecting</span>
      </div>
    </div>
  </div>
  <span class="platform-hint" id="platform-hint"></span>

  <div class="main">
    <div class="capture-card">
      <div class="range-options" id="range-selector">
        <label><input type="radio" name="range" value="0" checked><span>all</span></label>
        <label><input type="radio" name="range" value="3"><span>last 3</span></label>
        <label><input type="radio" name="range" value="5"><span>last 5</span></label>
        <label><input type="radio" name="range" value="10"><span>last 10</span></label>
      </div>
      <button class="capture-btn" id="btn-capture" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>
        </svg>
        <span class="label">
          capture full conversation
          <span class="desc">all messages as a markdown document</span>
        </span>
      </button>
    </div>

    <div class="selection-card">
      <button class="selection-btn" id="btn-selection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
          <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
          <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
          <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
          <path d="M8 12h8"/>
        </svg>
        <span class="label">
          capture selection
          <span class="desc">highlighted text from any page</span>
        </span>
      </button>
    </div>

    <div class="status" id="status"></div>
  </div>

  <div class="shortcuts">
    <div class="shortcuts-label">keyboard</div>
    <div class="shortcut-row">
      <span>capture page</span>
      <span class="keys"><span class="kbd" id="kbd-page">Cmd+Shift+E</span></span>
    </div>
    <div class="shortcut-row">
      <span>capture selection</span>
      <span class="keys"><span class="kbd" id="kbd-sel">Cmd+Shift+X</span></span>
    </div>
  </div>

  <div class="search-section">
    <input type="text" id="search-input" class="search-input" placeholder="search your documents" />
    <div id="search-results" class="search-results"></div>
  </div>

  <div class="footer">
    <a href="https://memory.wiki" target="_blank">memory.wiki</a>
    <span class="footer-right">
      <a href="#" id="link-settings">settings</a>
      <a href="https://memory.wiki/about" target="_blank">about</a>
    </span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
