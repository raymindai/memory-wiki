<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }

    /* ════════════════════════════════════════════════════════════════
       Pure design tokens — copied verbatim from
       apps/web/src/components/pure/styles/tokens.css so the popup
       reads as a slice of memory.wiki's /about page, not a one-off.
       ══════════════════════════════════════════════════════════════ */
    :root {
      --bg:          #08080a;
      --bg-deep:     #04040a;
      --hair:        rgba(255, 255, 255, 0.08);
      --hair-strong: rgba(255, 255, 255, 0.14);
      --hair-soft:   rgba(255, 255, 255, 0.04);
      --ink:    #fafafa;
      --strong: #ededed;
      --body:   #c2c2c5;
      --muted:  #8a8a92;
      --faint:  #5a5a62;
      --micro-lime:   #B5FF1A;  /* live / shipped / success — small dot only */
      --micro-orange: #FF6B1A;  /* beta / pending — unused here */
      --r-sm:   10px;
      --r-md:   14px;
      --r-lg:   20px;
      --r-pill: 9999px;
      --font-display: "Cal Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans:    -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      --font-mono:    "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      background: transparent;
      width: 384px;
    }
    body {
      width: 372px;
      margin: 6px;
      background: var(--bg);
      color: var(--body);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.55;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      border-radius: var(--r-lg);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 24px 64px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.35);
      animation: pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    a, button { font-family: inherit; letter-spacing: -0.005em; color: inherit; }

    /* ─── header — eyebrow + wordmark, /about hero shape ─── */
    .header {
      padding: 22px 22px 4px;
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .eyebrow .num {
      color: var(--ink);
      font-weight: 500;
    }
    .eyebrow .sep {
      color: var(--faint);
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .wordmark .mark {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
    }
    .wordmark .mark img { width: 100%; height: 100%; display: block; }
    .wordmark .product {
      color: var(--muted);
      font-weight: 500;
      font-family: var(--font-display);
    }

    /* ─── context line ─── */
    .context {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 16px 22px 18px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: -0.005em;
    }
    .context .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--faint);
      flex-shrink: 0;
    }
    .context .dot.live { background: var(--micro-lime); }
    .context em {
      font-style: normal;
      color: var(--ink);
      font-weight: 500;
    }

    /* ─── primary CTA — Pure /about hover-invert pill ─── */
    .actions { padding: 0 22px 14px; }

    .btn-primary {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--hair-strong);
      border-radius: var(--r-md);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 140ms ease, border-color 140ms ease, color 140ms ease, transform 120ms ease;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.992); }
    .btn-primary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn-primary .icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      color: currentColor;
    }
    .btn-primary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .btn-primary .stack { flex: 1; min-width: 0; }
    .btn-primary .stack .title {
      display: block;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.25;
      letter-spacing: 0;
    }
    .btn-primary .stack .sub {
      display: block;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--muted);
      margin-top: 3px;
      letter-spacing: -0.005em;
    }
    .btn-primary:hover:not(:disabled) .stack .sub { color: rgba(8, 8, 10, 0.65); }
    .btn-primary .kbd-inline { flex-shrink: 0; }

    /* ─── range pills ─── */
    .ranges {
      display: none;
      gap: 6px;
      margin-top: 10px;
    }
    .ranges.visible { display: flex; }
    .ranges label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: var(--r-pill);
      font-size: 11px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--hair);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
      font-family: var(--font-mono);
      letter-spacing: 0.04em;
    }
    .ranges label:hover {
      color: var(--body);
      border-color: var(--hair-strong);
    }
    .ranges input { display: none; }
    .ranges label:has(input:checked) {
      color: var(--ink);
      border-color: var(--ink);
    }

    /* SECONDARY — outline pill, smaller, quieter */
    .secondary {
      margin-top: 8px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: transparent;
      border: 1px solid var(--hair);
      border-radius: var(--r-md);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .secondary:hover {
      background: var(--bg-deep);
      color: var(--ink);
      border-color: var(--hair-strong);
    }
    .secondary .icon { width: 15px; height: 15px; color: var(--faint); }
    .secondary:hover .icon { color: var(--muted); }
    .secondary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .secondary .left { display: inline-flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .secondary .kbd-inline { flex-shrink: 0; }

    /* ─── status — neutral card ─── */
    .status {
      margin: 12px 22px 0;
      padding: 0;
      border-radius: var(--r-sm);
      font-size: 11.5px;
      text-align: center;
      min-height: 0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.2s, max-height 0.2s, padding 0.2s;
    }
    .status:not(:empty) {
      opacity: 1;
      padding: 11px 14px;
      max-height: 80px;
    }
    .status.success {
      background: var(--bg-deep);
      border: 1px solid var(--hair-strong);
      color: var(--ink);
      font-family: var(--font-mono);
    }
    .status.info {
      background: var(--bg-deep);
      border: 1px solid var(--hair);
      color: var(--body);
    }
    .status.error {
      background: rgba(239, 68, 68, 0.06);
      border: 1px solid rgba(239, 68, 68, 0.18);
      color: #f87171;
    }

    /* ─── account row — bottom, full-width, long names safe ─── */
    .account-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 22px 14px;
      margin-top: 18px;
      border-top: 1px solid var(--hair);
      font-size: 13px;
      color: var(--body);
      text-decoration: none;
      transition: background 0.1s;
    }
    .account-row:hover { background: var(--bg-deep); }
    .account-row .avatar {
      width: 24px;
      height: 24px;
      border-radius: 12px;
      background: var(--hair);
      color: var(--body);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account-row .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .account-row .body-stack {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .account-row .label {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--faint);
      text-transform: uppercase;
      letter-spacing: 0.14em;
    }
    .account-row .name {
      color: var(--ink);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-row .action {
      color: var(--muted);
      font-size: 11px;
      flex-shrink: 0;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
      text-transform: lowercase;
    }
    .account-row:hover .action { color: var(--ink); }

    /* ─── footer ─── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 22px 16px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--hair);
    }
    .footer .also {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }
    .footer .also-label {
      font-size: 9.5px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--faint);
      margin-right: 2px;
    }
    .footer a {
      color: var(--muted);
      text-decoration: none;
      transition: color 0.1s;
    }
    .footer a:hover { color: var(--ink); }
    .footer .sep { color: var(--faint); }
    .footer .right {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      letter-spacing: 0.06em;
    }

    /* ─── kbd ─── */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 26px;
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--hair-strong);
      border-bottom-width: 1.5px;
      border-radius: 6px;
      background: var(--bg-deep);
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--muted);
      letter-spacing: 0;
    }
    .btn-primary:hover:not(:disabled) .kbd {
      background: rgba(8, 8, 10, 0.80);
      color: var(--ink);
      border-color: rgba(8, 8, 10, 0.95);
    }

    .range-options { display: none; }
    .range-options.visible { display: flex; }
  </style>
</head>
<body>
  <div class="header">
    <div class="eyebrow">
      <span class="num">01</span>
      <span class="sep">/</span>
      <span>chrome clipper</span>
    </div>
    <a class="wordmark" href="https://memory.wiki" target="_blank" rel="noopener">
      <span class="mark"><img src="icons/icon128.png" alt=""></span>
      <span><span>memory.wiki</span> <span class="product">Clipper</span></span>
    </a>
  </div>

  <div class="context" id="context-line">
    <span class="dot" id="context-dot"></span>
    <span id="context-text">detecting page</span>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-capture" disabled>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>
        </svg>
      </span>
      <span class="stack">
        <span class="title" id="btn-capture-title">capture this page</span>
        <span class="sub" id="btn-capture-sub">clean markdown, shareable URL</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-page">⇧⌘E</span></span>
    </button>

    <div class="ranges range-options" id="range-selector">
      <label><input type="radio" name="range" value="0" checked><span>all</span></label>
      <label><input type="radio" name="range" value="3"><span>last 3</span></label>
      <label><input type="radio" name="range" value="5"><span>last 5</span></label>
      <label><input type="radio" name="range" value="10"><span>last 10</span></label>
    </div>

    <button class="secondary" id="btn-selection">
      <span class="left">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
            <path d="M8 12h8"/>
          </svg>
        </span>
        <span>capture selection</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-sel">⇧⌘X</span></span>
    </button>

    <div class="status" id="status"></div>
  </div>

  <a class="account-row" id="account-chip" href="#">
    <span class="avatar" id="account-avatar">?</span>
    <span class="body-stack">
      <span class="label">account</span>
      <span class="name" id="account-info">checking</span>
    </span>
    <span class="action" id="account-action-label">sign out</span>
  </a>

  <div class="footer">
    <span class="also">
      <span class="also-label">also</span>
      <a href="https://github.com/raymindai/memory-wiki/releases?q=desktop" target="_blank" rel="noopener" title="memory.wiki for Mac">mac</a>
      <span class="sep">·</span>
      <a href="https://marketplace.visualstudio.com/items?itemName=raymindai.memory-wiki-vscode" target="_blank" rel="noopener" title="memory.wiki for VS Code">vscode</a>
      <span class="sep">·</span>
      <a href="https://www.npmjs.com/package/memory-wiki-cli" target="_blank" rel="noopener" title="memory.wiki CLI + MCP">cli</a>
    </span>
    <span class="right">
      <a href="#" id="link-settings">settings</a>
      <a href="https://memory.wiki/about" target="_blank" rel="noopener">about</a>
    </span>
  </div>

  <!-- legacy stubs for popup.js -->
  <span id="search-input" style="display:none"></span>
  <span id="search-results" style="display:none"></span>
  <span id="platform-badge" style="display:none"></span>
  <span id="platform-dot" style="display:none"></span>
  <span id="platform-name" style="display:none"></span>
  <span id="platform-hint" style="display:none"></span>

  <script src="popup.js"></script>
</body>
</html>
