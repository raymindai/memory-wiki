<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:">
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("fonts/CalSans-Regular.ttf") format("truetype");
      font-weight: 400 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --canvas:        #09090b;
      --canvas-lift:   #0f0f12;
      --surface:       rgba(255,255,255,0.04);
      --surface-hover: rgba(255,255,255,0.06);
      --surface-press: rgba(255,255,255,0.10);
      --border-faint:  rgba(255,255,255,0.06);
      --border:        rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --text-primary:  #fafafa;
      --text-secondary:#a1a1aa;
      --text-muted:    #71717a;
      --text-faint:    #52525b;
      --brand-warm:    #fb923c;
      --brand-warm-tint: rgba(251, 146, 60, 0.20);
      --micro-ok:      #B5FF1A;
      --radius-window: 18px;
      --radius-card:   14px;
      --radius-pill:   999px;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Chrome's popup window is transparent at the edges when the html
       background is transparent — so the rounded card inside reads as
       the actual window shape. 6 px gutter on body so the OS-frame
       transparency has room to breathe and the card's box-shadow can
       show. */
    html {
      background: transparent;
      width: 372px;
    }
    body {
      width: 360px;
      margin: 6px;
      padding: 0;
      background: var(--canvas);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      letter-spacing: 0;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      border-radius: var(--radius-window);
      overflow: hidden;
      position: relative;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.04) inset,
        0 20px 60px rgba(0,0,0,0.55),
        0 4px 12px rgba(0,0,0,0.35);
      animation: pop-in 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes pop-in {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: none; }
    }

    /* Ambient brand glow */
    body::before {
      content: "";
      position: absolute;
      top: -90px;
      right: -70px;
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--brand-warm-tint) 0%, rgba(251, 146, 60, 0.06) 45%, transparent 75%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
      animation: blob-drift 22s ease-in-out infinite alternate;
    }
    @keyframes blob-drift {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(-12px, 16px) scale(1.06); }
      100% { transform: translate(8px, -10px) scale(0.96); }
    }

    body > * { position: relative; z-index: 1; }

    a, button { font-family: inherit; letter-spacing: 0; }

    /* ─── top bar ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 20px 12px;
      gap: 12px;
    }

    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: "Cal Sans", -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0;
      color: var(--text-primary);
      text-decoration: none;
      line-height: 1;
      flex-shrink: 0;
    }
    .wordmark .mark {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      display: inline-block;
      border-radius: 5px;
      overflow: hidden;
    }
    .wordmark .mark img { width: 100%; height: 100%; display: block; }

    .account {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 4px 4px 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      border: 1px solid var(--border-faint);
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: none;
      max-width: 170px;
      min-width: 0;
      transition: background 0.12s, border-color 0.12s, max-width 0.2s;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    .account:hover { background: var(--surface-hover); border-color: var(--border); }
    .account .label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account .avatar {
      width: 22px;
      height: 22px;
      border-radius: 11px;
      background: var(--surface-press);
      color: var(--text-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }
    .account .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ─── context line ─── */
    .context {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 20px 18px;
      font-size: 12px;
      color: var(--text-secondary);
    }
    .context .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-faint);
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .context .dot.live {
      background: var(--micro-ok);
      box-shadow: 0 0 0 3px rgba(181, 255, 26, 0.15);
    }
    .context em {
      font-style: normal;
      color: var(--text-primary);
      font-weight: 500;
    }

    /* ─── actions ─── */
    .actions { padding: 0 20px 18px; }

    .btn-primary {
      position: relative;
      display: flex;
      width: 100%;
      align-items: center;
      gap: 14px;
      padding: 16px 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.16s, border-color 0.16s, transform 0.08s, box-shadow 0.16s;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0,0,0,0.25);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
      border-color: var(--border-strong);
    }
    .btn-primary:active:not(:disabled) { transform: scale(0.992); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
    .btn-primary .icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      color: var(--text-primary);
      opacity: 0.85;
    }
    .btn-primary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .btn-primary .stack { flex: 1; min-width: 0; }
    .btn-primary .stack .title { display: block; font-weight: 600; line-height: 1.3; }
    .btn-primary .stack .sub {
      display: block;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 3px;
      letter-spacing: 0;
    }
    .btn-primary .kbd-inline { flex-shrink: 0; }

    /* ─── range pills ─── */
    .ranges {
      display: none;
      gap: 6px;
      margin-top: 10px;
    }
    .ranges.visible { display: flex; }
    .ranges label {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      border-radius: 8px;
      font-size: 11px;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border-faint);
      cursor: pointer;
      transition: background 0.1s, color 0.1s, border-color 0.1s;
    }
    .ranges label:hover { background: var(--surface-hover); color: var(--text-secondary); }
    .ranges input { display: none; }
    .ranges label:has(input:checked) {
      background: var(--surface-press);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }

    /* ─── secondary ─── */
    .secondary {
      margin-top: 10px;
      padding: 11px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border-faint);
      border-radius: var(--radius-card);
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .secondary:hover { background: var(--surface); color: var(--text-primary); border-color: var(--border); }
    .secondary .icon { width: 16px; height: 16px; color: var(--text-muted); }
    .secondary .icon svg { width: 100%; height: 100%; stroke-width: 1.6; }
    .secondary .left { display: inline-flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
    .secondary .kbd-inline { flex-shrink: 0; }

    /* ─── status / URL pill ─── */
    .status {
      margin: 12px 20px 0;
      padding: 0;
      border-radius: 10px;
      font-size: 11.5px;
      text-align: center;
      min-height: 0;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.2s, max-height 0.2s, padding 0.2s;
      font-family: var(--mono);
    }
    .status:not(:empty) {
      opacity: 1;
      padding: 10px 14px;
      max-height: 80px;
    }
    .status.success {
      background: linear-gradient(180deg, rgba(181, 255, 26, 0.12), rgba(181, 255, 26, 0.05));
      border: 1px solid rgba(181, 255, 26, 0.20);
      color: var(--micro-ok);
      font-weight: 500;
    }
    .status.info {
      background: var(--surface);
      border: 1px solid var(--border-faint);
      color: var(--text-secondary);
      font-family: inherit;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      font-family: inherit;
    }

    /* ─── cross-promo strip ─── */
    .also {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 14px 20px 8px;
      margin-top: 14px;
      border-top: 1px solid var(--border-faint);
    }
    .also-label {
      font-size: 9.5px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 1.4px;
      margin-right: 6px;
      font-family: var(--mono);
      font-weight: 500;
    }
    .also a {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      border: 1px solid var(--border-faint);
      background: var(--surface);
      color: var(--text-muted);
      text-decoration: none;
      transition: background 0.12s, color 0.12s, border-color 0.12s, transform 0.08s;
    }
    .also a:hover {
      background: var(--surface-hover);
      color: var(--text-primary);
      border-color: var(--border);
      transform: translateY(-1px);
    }
    .also a.current {
      border-color: rgba(181, 255, 26, 0.30);
      color: var(--micro-ok);
      pointer-events: none;
    }
    .also a svg { width: 14px; height: 14px; stroke-width: 1.6; }

    /* ─── footer ─── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px 16px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.1s;
    }
    .footer a:hover { color: var(--text-primary); }
    .footer .right { display: inline-flex; gap: 14px; }

    /* ─── kbd ─── */
    .kbd {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 24px;
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--border);
      border-bottom-width: 1.5px;
      border-radius: 6px;
      background: rgba(0,0,0,0.35);
      font-family: var(--mono);
      font-size: 10.5px;
      color: var(--text-secondary);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
    }

    /* legacy compatibility */
    .range-options { display: none; }
    .range-options.visible { display: flex; }
  </style>
</head>
<body>
  <div class="topbar">
    <a class="wordmark" href="https://memory.wiki" target="_blank" rel="noopener">
      <span class="mark"><img src="icons/icon128.png" alt=""></span>
      <span>memory.wiki</span>
    </a>
    <a class="account" id="account-chip" href="#" title="">
      <span class="avatar" id="account-avatar">?</span>
      <span class="label" id="account-info">checking</span>
    </a>
  </div>

  <div class="context" id="context-line">
    <span class="dot" id="context-dot"></span>
    <span id="context-text">detecting page</span>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-capture" disabled>
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <path d="M14 2v6h6"/>
          <path d="M8 13h8"/>
          <path d="M8 17h5"/>
        </svg>
      </span>
      <span class="stack">
        <span class="title" id="btn-capture-title">capture this page</span>
        <span class="sub" id="btn-capture-sub">clean markdown, shareable URL</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-page">⇧⌘E</span></span>
    </button>

    <div class="ranges range-options" id="range-selector">
      <label><input type="radio" name="range" value="0" checked><span>all</span></label>
      <label><input type="radio" name="range" value="3"><span>last 3</span></label>
      <label><input type="radio" name="range" value="5"><span>last 5</span></label>
      <label><input type="radio" name="range" value="10"><span>last 10</span></label>
    </div>

    <button class="secondary" id="btn-selection">
      <span class="left">
        <span class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8V6a2 2 0 0 1 2-2h2"/>
            <path d="M4 16v2a2 2 0 0 0 2 2h2"/>
            <path d="M16 4h2a2 2 0 0 1 2 2v2"/>
            <path d="M16 20h2a2 2 0 0 0 2-2v-2"/>
            <path d="M8 12h8"/>
          </svg>
        </span>
        <span>capture selection</span>
      </span>
      <span class="kbd-inline"><span class="kbd" id="kbd-sel">⇧⌘X</span></span>
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="also">
    <span class="also-label">also on</span>
    <a href="https://github.com/raymindai/memory-wiki/releases?q=desktop" target="_blank" rel="noopener" title="memory.wiki for Mac (Desktop app)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="14" rx="2"/>
        <path d="M3 14h18"/>
        <path d="M9 18h6l-1 2h-4z"/>
      </svg>
    </a>
    <a href="https://marketplace.visualstudio.com/items?itemName=raymindai.memory-wiki-vscode" target="_blank" rel="noopener" title="memory.wiki for VS Code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="16 18 22 12 16 6"/>
        <polyline points="8 6 2 12 8 18"/>
        <line x1="14" y1="4" x2="10" y2="20"/>
      </svg>
    </a>
    <a href="https://www.npmjs.com/package/memory-wiki-cli" target="_blank" rel="noopener" title="memory.wiki CLI + MCP server">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4 17 10 11 4 5"/>
        <line x1="12" y1="19" x2="20" y2="19"/>
      </svg>
    </a>
    <a class="current" href="#" title="you're on the chrome extension">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M22 12h-9.5"/>
        <path d="M5.5 6 12 12"/>
        <path d="M5.5 18 12 12"/>
      </svg>
    </a>
  </div>

  <div class="footer">
    <a href="https://memory.wiki" target="_blank" rel="noopener">memory.wiki</a>
    <span class="right">
      <a href="#" id="link-settings">settings</a>
      <a href="https://memory.wiki/about" target="_blank" rel="noopener">about</a>
    </span>
  </div>

  <!-- legacy stubs for popup.js -->
  <span id="search-input" style="display:none"></span>
  <span id="search-results" style="display:none"></span>
  <span id="platform-badge" style="display:none"></span>
  <span id="platform-dot" style="display:none"></span>
  <span id="platform-name" style="display:none"></span>
  <span id="platform-hint" style="display:none"></span>
  <span id="account-action" style="display:none"></span>

  <script src="popup.js"></script>
</body>
</html>
